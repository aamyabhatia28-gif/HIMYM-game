<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue French Horn Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  #canvasWrapper { position: relative; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="canvasWrapper">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive scaling
function resize() {
  const scale = Math.min(window.innerWidth / 800, window.innerHeight / 400);
  canvas.style.width = (800 * scale) + 'px';
  canvas.style.height = (400 * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Web Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function sfxJump() { playSound(400, 'square', 0.15, 0.12); }
function sfxCollect() { playSound(880, 'sine', 0.2, 0.15); playSound(1100, 'sine', 0.2, 0.1); }
function sfxHit() { playSound(150, 'sawtooth', 0.3, 0.2); }
function sfxGameOver() { [440,330,220,110].forEach((f,i) => { setTimeout(() => playSound(f,'square',0.4,0.15), i*150); }); }
function sfxBossHit() { playSound(600, 'square', 0.1, 0.2); }
function sfxBossDie() { [300,600,900,600,300].forEach((f,i) => setTimeout(() => playSound(f,'square',0.15,0.2), i*100)); }

// LocalStorage
function saveProgress(score, level) {
  const hs = parseInt(localStorage.getItem('himym_hs') || '0');
  const hl = parseInt(localStorage.getItem('himym_hl') || '1');
  if (score > hs) localStorage.setItem('himym_hs', score);
  if (level > hl) localStorage.setItem('himym_hl', level);
}
function getHighScore() { return parseInt(localStorage.getItem('himym_hs') || '0'); }
function getHighLevel() { return parseInt(localStorage.getItem('himym_hl') || '1'); }

// Game state
const STATES = { START: 0, PLAYING: 1, BOSS: 2, GAME_OVER: 3, TRANSITION: 4, ENDING: 5 };
let state = STATES.START;
let selectedChar = 'ted';
let score = 0;
let lives = 3;
let hornCount = 0;
let currentLevel = 1;
let invincible = false;
let invincibleTimer = 0;
let flashRed = false;
let gameSpeed = 2;
let scrollX = 0;
let frameCount = 0;

// Level definitions
const LEVELS = {
  1: { name: "Apartment", scoreLimit: 500, bgColor: '#c4956a', accentColor: '#8b5e3c' },
  2: { name: "MacLaren's Bar", scoreLimit: 1200, bgColor: '#2c1810', accentColor: '#4a2c1a' },
  3: { name: "NYC Street", scoreLimit: Infinity, bgColor: '#87ceeb', accentColor: '#4a90d9' }
};

// Player
const GROUND = 310;
const player = {
  x: 100, y: GROUND, w: 36, h: 48,
  vy: 0, onGround: true, ducking: false,
  duckTimer: 0
};

// Parallax layers
let parallaxLayers = [];
function initParallax(level) {
  parallaxLayers = [];
  if (level === 1) {
    // Apartment: windows on walls
    for (let i = 0; i < 6; i++) {
      parallaxLayers.push({ type: 'window', x: 150 * i + 50, y: 80, speed: 0.3 });
    }
    for (let i = 0; i < 4; i++) {
      parallaxLayers.push({ type: 'window', x: 200 * i + 100, y: 160, speed: 0.5 });
    }
  } else if (level === 2) {
    // Bar: stools, bottles
    for (let i = 0; i < 5; i++) {
      parallaxLayers.push({ type: 'stool', x: 160 * i + 80, y: 240, speed: 0.6 });
    }
    for (let i = 0; i < 8; i++) {
      parallaxLayers.push({ type: 'bottle', x: 100 * i + 50, y: 60, speed: 0.2 });
    }
  } else if (level === 3) {
    // NYC: buildings
    for (let i = 0; i < 10; i++) {
      parallaxLayers.push({ type: 'building', x: 120 * i, y: 50 + Math.random() * 100, h: 150 + Math.random() * 100, w: 60 + Math.random() * 50, speed: 0.4 + Math.random() * 0.3 });
    }
  }
}

// Obstacles — 2 per level
const OBSTACLE_TYPES = [
  { name: 'Goat',          color: '#9e9e9e', points: -30, w: 40, h: 50, levels: [1] },
  { name: 'Pineapple',     color: '#fdd835', points: -15, w: 28, h: 50, levels: [1] },
  { name: 'Pizza',         color: '#e53935', points: -10, w: 36, h: 36, levels: [2] },
  { name: 'Slutty Pumpkin',color: '#ff6b00', points: -20, w: 38, h: 48, levels: [2] },
  { name: 'Red Boots',     color: '#c62828', points: -25, w: 45, h: 38, levels: [3] },
  { name: 'Goat',          color: '#9e9e9e', points: -30, w: 40, h: 50, levels: [3] },
];

let obstacles = [];
let collectibles = [];
let particles = [];
let obstacleTimer = 0;
let collectibleTimer = 0;

// Boss
let boss = null;
let bossProjectiles = [];
let bossPhase = false;
let transitionTimer = 0;
let transitionAlpha = 0;

// Input
const keys = {};
let jumpPressed = false;
let duckPressed = false;
// Double-jump tracking
let jumpsUsed = 0;
let lastSpaceTime = 0;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !jumpPressed) {
    jumpPressed = true;
    if (e.code === 'Space') {
      const now = performance.now();
      const isDouble = (now - lastSpaceTime) < 300 && jumpsUsed === 1;
      lastSpaceTime = now;
      handleJump(isDouble);
    } else {
      handleJump(false);
    }
  }
  if (e.code === 'ArrowDown') duckPressed = true;
  if (e.code === 'Space' && state === STATES.START) startGame();
  if (e.code === 'Space' && state === STATES.GAME_OVER) startGame();
  if (e.code === 'Space' && state === STATES.ENDING && endingTimer >= 300) startGame();
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ArrowUp' || e.code === 'Space') jumpPressed = false;
  if (e.code === 'ArrowDown') { duckPressed = false; player.ducking = false; }
});

// Touch — two quick taps = double jump
let lastTapTime = 0;
canvas.addEventListener('touchstart', e => {
  if (state === STATES.START) { startGame(); e.preventDefault(); return; }
  if (state === STATES.GAME_OVER) { startGame(); e.preventDefault(); return; }
  if (state === STATES.PLAYING || state === STATES.BOSS) {
    const now = performance.now();
    const isDouble = (now - lastTapTime) < 300 && jumpsUsed === 1;
    lastTapTime = now;
    handleJump(isDouble);
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  player.ducking = false;
  e.preventDefault();
}, { passive: false });

function handleJump(isDouble) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (state === STATES.PLAYING || state === STATES.BOSS) {
    if (player.onGround && !player.ducking) {
      // Normal jump
      player.vy = -14;
      player.onGround = false;
      jumpsUsed = 1;
      sfxJump();
    } else if (isDouble && jumpsUsed === 1) {
      // Double jump — bigger boost, higher pitch sound
      player.vy = -20;
      jumpsUsed = 2;
      playSound(600, 'sine', 0.18, 0.14);
      playSound(900, 'sine', 0.12, 0.1);
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#fdd835', 6);
    }
  }
}

// Character select on start screen
canvas.addEventListener('click', e => {
  if (state === STATES.START) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * (400 / rect.height);
    // Ted button ~300,270 Robin ~500,270
    if (mx > 260 && mx < 380 && my > 240 && my < 300) selectedChar = 'ted';
    if (mx > 420 && mx < 540 && my > 240 && my < 300) selectedChar = 'robin';
  }
});

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  score = 0;
  lives = 3;
  hornCount = 0;
  currentLevel = 1;
  gameSpeed = 2;
  obstacles = [];
  collectibles = [];
  particles = [];
  bossProjectiles = [];
  boss = null;
  bossPhase = false;
  invincible = false;
  invincibleTimer = 0;
  flashRed = false;
  player.x = 100;
  player.y = GROUND;
  player.vy = 0;
  player.onGround = true;
  player.ducking = false;
  obstacleTimer = 0;
  collectibleTimer = 0;
  scrollX = 0;
  frameCount = 0;
  initParallax(1);
  state = STATES.PLAYING;
}

// Drawing functions

function drawBackground(level) {
  if (level === 1) {
    // Apartment
    ctx.fillStyle = '#c4956a';
    ctx.fillRect(0, 0, 800, 320);
    ctx.fillStyle = '#8b5e3c';
    ctx.fillRect(0, 315, 800, 85);
    // Baseboard
    ctx.fillStyle = '#6b3f1c';
    ctx.fillRect(0, 315, 800, 8);
    // Ceiling trim
    ctx.fillStyle = '#a0714a';
    ctx.fillRect(0, 0, 800, 12);
  } else if (level === 2) {
    // MacLaren's Bar
    ctx.fillStyle = '#1a0d08';
    ctx.fillRect(0, 0, 800, 320);
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(0, 200, 800, 120);
    // Bar top
    ctx.fillStyle = '#3e2010';
    ctx.fillRect(0, 265, 800, 20);
    ctx.fillStyle = '#5c3020';
    ctx.fillRect(0, 263, 800, 5);
    // Floor
    ctx.fillStyle = '#1a0d08';
    ctx.fillRect(0, 315, 800, 85);
    // Ambient light
    ctx.fillStyle = 'rgba(255,180,60,0.04)';
    ctx.fillRect(0, 0, 800, 320);
  } else if (level === 3) {
    // NYC Street
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(0, 0, 800, 260);
    // Ground
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(0, 315, 800, 85);
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(0, 312, 800, 8);
    // Sidewalk line
    ctx.fillStyle = '#d1d5db';
    for (let i = 0; i < 800; i += 80) {
      ctx.fillRect(((i - scrollX * 0.8) % 800 + 800) % 800, 320, 40, 3);
    }
  }
}

function drawParallax(level) {
  parallaxLayers.forEach(layer => {
    const px = ((layer.x - scrollX * layer.speed) % 1200 + 1200) % 1200;
    if (level === 1) {
      if (layer.type === 'window') {
        ctx.fillStyle = '#d4a574';
        ctx.fillRect(px, layer.y, 60, 80);
        ctx.fillStyle = '#87ceeb';
        ctx.fillRect(px + 5, layer.y + 5, 50, 70);
        // Window panes
        ctx.strokeStyle = '#d4a574';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + 30, layer.y + 5);
        ctx.lineTo(px + 30, layer.y + 75);
        ctx.moveTo(px + 5, layer.y + 40);
        ctx.lineTo(px + 55, layer.y + 40);
        ctx.stroke();
        // Window sill
        ctx.fillStyle = '#8b5e3c';
        ctx.fillRect(px - 3, layer.y + 75, 66, 6);
      }
    } else if (level === 2) {
      if (layer.type === 'stool') {
        // Bar stool
        ctx.fillStyle = '#3e2010';
        ctx.fillRect(px, layer.y, 30, 5);
        ctx.fillStyle = '#5c3020';
        ctx.fillRect(px + 12, layer.y + 5, 6, 50);
        ctx.fillStyle = '#4a2c1a';
        ctx.fillRect(px + 4, layer.y + 55, 22, 5);
      } else if (layer.type === 'bottle') {
        // Bottle on shelf
        ctx.fillStyle = '#2d5a1b';
        ctx.fillRect(px, layer.y, 12, 35);
        ctx.fillStyle = '#1d3d12';
        ctx.fillRect(px + 3, layer.y - 8, 6, 10);
        ctx.fillStyle = '#8b7355';
        ctx.fillRect(0, layer.y + 35, 800, 6);
      }
    } else if (level === 3) {
      if (layer.type === 'building') {
        ctx.fillStyle = '#374151';
        ctx.fillRect(px, layer.y, layer.w, layer.h);
        // Windows
        ctx.fillStyle = '#fbbf24';
        for (let wy = layer.y + 10; wy < layer.y + layer.h - 10; wy += 20) {
          for (let wx = px + 8; wx < px + layer.w - 8; wx += 16) {
            if (Math.random() > 0.3) {
              ctx.fillRect(wx, wy, 8, 10);
            }
          }
        }
      }
    }
  });
}

function drawGround(level) {
  // Ground line
  ctx.fillStyle = level === 2 ? '#3e2010' : level === 3 ? '#9ca3af' : '#8b5e3c';
  ctx.fillRect(0, GROUND + 48, 800, 5);
}

function drawCartoonChar(cx, baseY, isTed, ducking) {
  ctx.save();

  const H      = ducking ? 36 : 58;  // total height
  const headR  = 13;
  const headCY = baseY + headR;
  const bodyY  = headCY + headR - 2;
  const bodyH  = ducking ? 14 : 26;
  const legY   = bodyY + bodyH;

  // ── shared skin colour ──
  const skin = '#FACBA0';
  const skinDark = '#E8A87C';

  if (isTed) {
    /* LEGS */
    if (!ducking) {
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.roundRect(cx - 12, legY, 10, 18, [0,0,4,4]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx + 2,  legY, 10, 18, [0,0,4,4]); ctx.fill();
      // shoes
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(cx - 7,  legY + 18, 9, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 7,  legY + 18, 9, 4, 0, 0, Math.PI*2); ctx.fill();
    }

    /* BODY — blue jacket */
    ctx.fillStyle = '#2176C7';
    ctx.beginPath(); ctx.roundRect(cx - 15, bodyY, 30, bodyH, [3,3,6,6]); ctx.fill();
    // shirt + tie strip
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(cx - 3, bodyY, 6, bodyH);
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.moveTo(cx-2, bodyY+1); ctx.lineTo(cx+2, bodyY+1);
    ctx.lineTo(cx+3, bodyY+bodyH-4); ctx.lineTo(cx, bodyY+bodyH-1); ctx.lineTo(cx-3, bodyY+bodyH-4);
    ctx.closePath(); ctx.fill();

    /* HEAD */
    // ears
    ctx.fillStyle = skinDark;
    ctx.beginPath(); ctx.ellipse(cx-headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    // face
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(cx, headCY, headR, 0, Math.PI*2); ctx.fill();
    // hair — warm brown cap
    ctx.fillStyle = '#7B4F2E';
    ctx.beginPath(); ctx.arc(cx, headCY, headR, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 4, headCY - headR + 3, 10, 7, -0.3, Math.PI, Math.PI*2); ctx.fill();
    // eyebrows
    ctx.strokeStyle = '#5a3010'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(cx-5, headCY-2, 4, Math.PI+0.3, Math.PI*2-0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+5, headCY-2, 4, Math.PI+0.3, Math.PI*2-0.3); ctx.stroke();
    // eyes — white + iris + pupil
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx-5, headCY+2, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+5, headCY+2, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6B4226';
    ctx.beginPath(); ctx.arc(cx-5, headCY+2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5, headCY+2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx-5, headCY+2, 1.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5, headCY+2, 1.1, 0, Math.PI*2); ctx.fill();
    // catchlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx-4, headCY+1, 0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, headCY+1, 0.6, 0, Math.PI*2); ctx.fill();
    // rosy cheeks
    ctx.fillStyle = 'rgba(240,130,100,0.22)';
    ctx.beginPath(); ctx.ellipse(cx-9, headCY+5, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+9, headCY+5, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    // smile
    ctx.strokeStyle = '#b5673a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, headCY+6, 5, 0.15, Math.PI-0.15); ctx.stroke();

  } else {
    /* LEGS */
    if (!ducking) {
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(cx - 11, legY, 9, 18, [0,0,4,4]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx + 2,  legY, 9, 18, [0,0,4,4]); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(cx - 6,  legY + 18, 8, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 6,  legY + 18, 8, 4, 0, 0, Math.PI*2); ctx.fill();
    }

    /* BODY — red top */
    ctx.fillStyle = '#C0392B';
    ctx.beginPath(); ctx.roundRect(cx - 14, bodyY, 28, bodyH, [3,3,6,6]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.ellipse(cx, bodyY+2, 7, 4, 0, Math.PI, Math.PI*2); ctx.fill();

    /* HEAD — draw ears first, then face */
    ctx.fillStyle = skinDark;
    ctx.beginPath(); ctx.ellipse(cx - headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();

    // Face — slightly oval (taller than wide), feminine
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(cx, headCY + 1, headR - 1, headR + 1, 0, 0, Math.PI*2); ctx.fill();

    // Hair top — dark cap sitting ON TOP of head
    ctx.fillStyle = '#2C1810';
    ctx.beginPath(); ctx.ellipse(cx, headCY - 4, headR, 9, 0, Math.PI, Math.PI*2); ctx.fill();
    // Side hair — two smooth strands framing the face (not wrapping under chin)
    ctx.beginPath(); ctx.ellipse(cx - headR - 1, headCY + 4, 5, 12, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headR + 1, headCY + 4, 5, 12,  0.15, 0, Math.PI*2); ctx.fill();

    // Eyebrows — thin, high, arched
    ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx - 5, headCY - 3, 4.5, Math.PI + 0.5, Math.PI*2 - 0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 5, headCY - 3, 4.5, Math.PI + 0.5, Math.PI*2 - 0.5); ctx.stroke();

    // Eyes — big, almond-shaped
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx - 5, headCY + 2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 5, headCY + 2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    // Iris — blue-grey
    ctx.fillStyle = '#4A6FA5';
    ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
    // Catchlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 4, headCY + 1.5, 0.7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 6, headCY + 1.5, 0.7, 0, Math.PI*2); ctx.fill();
    // Lashes — top lid only, short strokes fanning up
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2;
    [[-5,0],[-3,-0.5],[-1,-1],[1,-0.5]].forEach(([dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx - 5 + dx*0.6, headCY - 1.5 + dy);
      ctx.lineTo(cx - 5 + dx, headCY - 4 + dy);
      ctx.stroke();
    });
    [[5,0],[3,-0.5],[1,-1],[-1,-0.5]].forEach(([dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + 5 + dx*0.6, headCY - 1.5 + dy);
      ctx.lineTo(cx + 5 + dx, headCY - 4 + dy);
      ctx.stroke();
    });

    // Rosy cheeks
    ctx.fillStyle = 'rgba(240,120,100,0.22)';
    ctx.beginPath(); ctx.ellipse(cx - 9, headCY + 6, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 9, headCY + 6, 5, 3, 0, 0, Math.PI*2); ctx.fill();

    // Lips — clearly pink, two-tone
    ctx.fillStyle = '#E05C6A';
    ctx.beginPath(); ctx.ellipse(cx, headCY + 9, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F4A0A8';
    ctx.beginPath(); ctx.ellipse(cx, headCY + 8, 3.5, 1.5, 0, 0, Math.PI); ctx.fill();
  }

  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (invincible && Math.floor(frameCount / 4) % 2 === 0) return;
  const baseY = p.ducking ? GROUND + 18 : p.y;
  const cx = p.x + p.w / 2;
  drawCartoonChar(cx, baseY, selectedChar === 'ted', p.ducking);
}

function drawBlueHorn(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Coiled tube — two nested arcs give the circular wound look
  ctx.strokeStyle = '#1565c0';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(0, 0, 18, Math.PI * 0.2, Math.PI * 1.85);
  ctx.stroke();
  ctx.strokeStyle = '#1e88e5';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 11, Math.PI * 0.3, Math.PI * 1.7);
  ctx.stroke();

  // Bell — flared opening at bottom-right
  ctx.fillStyle = '#1e88e5';
  ctx.beginPath();
  ctx.moveTo(12, 4);
  ctx.bezierCurveTo(22, 4, 30, 10, 28, 20);
  ctx.bezierCurveTo(26, 28, 14, 28, 10, 20);
  ctx.bezierCurveTo(8, 14, 8, 8, 12, 4);
  ctx.fill();
  // Bell opening (dark inside)
  ctx.fillStyle = '#0d47a1';
  ctx.beginPath();
  ctx.ellipse(19, 20, 7, 9, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Mouthpiece stem — thin tube going up-left
  ctx.strokeStyle = '#90caf9';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-14, -14);
  ctx.lineTo(-22, -22);
  ctx.stroke();
  // Mouthpiece cup
  ctx.fillStyle = '#bbdefb';
  ctx.beginPath();
  ctx.arc(-23, -23, 4, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(-4, -6, 5, 3, -0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawObstacle(obs) {
  ctx.save();
  ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2); // draw centred

  if (obs.name === 'Goat') {
    // ── Cute cartoon goat ──
    const bx = 0, by = 6; // body centre offset

    // Body — rounded fluffy oval
    ctx.fillStyle = '#DCDCDC';
    ctx.beginPath(); ctx.ellipse(bx, by + 10, 20, 14, 0, 0, Math.PI*2); ctx.fill();
    // Fluffy texture highlight
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(bx - 5, by + 4, 10, 7, -0.3, 0, Math.PI*2); ctx.fill();

    // Head — big round
    ctx.fillStyle = '#E8E8E8';
    ctx.beginPath(); ctx.arc(bx + 14, by - 8, 13, 0, Math.PI*2); ctx.fill();

    // Horns — cute stubby curves
    ctx.fillStyle = '#B0A090';
    ctx.beginPath(); ctx.ellipse(bx + 9,  by - 19, 3, 6, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 19, by - 19, 3, 6,  0.3, 0, Math.PI*2); ctx.fill();

    // Ears — floppy
    ctx.fillStyle = '#F0C0B0';
    ctx.beginPath(); ctx.ellipse(bx + 3,  by - 10, 5, 8, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 25, by - 10, 5, 8,  0.6, 0, Math.PI*2); ctx.fill();

    // Eyes — big cute dots with shine
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(bx + 10, by - 9, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 19, by - 9, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx + 11, by - 10, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 20, by - 10, 1.2, 0, Math.PI*2); ctx.fill();

    // Snout
    ctx.fillStyle = '#F5B8A0';
    ctx.beginPath(); ctx.ellipse(bx + 14, by - 3, 6, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C08070';
    ctx.beginPath(); ctx.arc(bx + 11.5, by - 3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 16.5, by - 3, 1.5, 0, Math.PI*2); ctx.fill();

    // Little beard tuft
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(bx + 14, by + 3, 4, 5, 0, 0, Math.PI*2); ctx.fill();

    // Legs — 4 stubby rounded legs
    ctx.fillStyle = '#C8C8C8';
    [bx-14, bx-5, bx+5, bx+14].forEach(lx => {
      ctx.beginPath(); ctx.roundRect(lx - 3, by + 20, 7, 12, 3); ctx.fill();
    });
    // Hooves
    ctx.fillStyle = '#888';
    [bx-14, bx-5, bx+5, bx+14].forEach(lx => {
      ctx.beginPath(); ctx.ellipse(lx + 0.5, by + 32, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    });

  } else if (obs.name === 'Slutty Pumpkin') {
    // ── Cute round pumpkin ──
    // Stem
    ctx.fillStyle = '#5D8A3C';
    ctx.beginPath(); ctx.roundRect(-4, -26, 8, 10, 4); ctx.fill();
    // Leaf curl
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath(); ctx.ellipse(7, -22, 8, 5, 0.6, 0, Math.PI*2); ctx.fill();

    // Main pumpkin body — three overlapping circles for ribbing
    const pc = '#E8650A';
    const pd = '#BF4800';
    [[-14, 0, 11, 17], [0, 0, 14, 19], [14, 0, 11, 17]].forEach(([ex, ey, rx, ry]) => {
      ctx.fillStyle = pc;
      ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    });
    // Centre rib highlight
    ctx.fillStyle = '#F07020';
    ctx.beginPath(); ctx.ellipse(0, -4, 5, 10, 0, 0, Math.PI*2); ctx.fill();

    // Cute face — triangle eyes & smile
    ctx.fillStyle = '#2C1200';
    // Left eye — triangle
    ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(-5,-1); ctx.lineTo(-13,-1); ctx.closePath(); ctx.fill();
    // Right eye
    ctx.beginPath(); ctx.moveTo(9,-6); ctx.lineTo(13,-1); ctx.lineTo(5,-1); ctx.closePath(); ctx.fill();
    // Smile — curved
    ctx.strokeStyle = '#2C1200'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 4, 7, 0.2, Math.PI - 0.2); ctx.stroke();
    // Little hat (costume!)
    ctx.fillStyle = '#7B1FA2';
    ctx.beginPath(); ctx.roundRect(-12, -34, 24, 10, 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8,-34); ctx.lineTo(0,-50); ctx.lineTo(8,-34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.roundRect(-14,-28,28,5,2); ctx.fill();

  } else if (obs.name === 'Pizza') {
    // ── Cute pizza slice ──
    // Crust (rounded at top)
    ctx.fillStyle = '#D4956A';
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.quadraticCurveTo(-20, -12, -14, -18);
    ctx.quadraticCurveTo(0, -22, 14, -18);
    ctx.quadraticCurveTo(20, -12, 0, 18);
    ctx.closePath(); ctx.fill();
    // Crust highlight
    ctx.fillStyle = '#E8B080';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.quadraticCurveTo(-14, -8, -9, -15);
    ctx.quadraticCurveTo(0, -17, 9, -15);
    ctx.quadraticCurveTo(14, -8, 0, 12);
    ctx.closePath(); ctx.fill();
    // Cheese
    ctx.fillStyle = '#FDD835';
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.quadraticCurveTo(-11, -6, -6, -12);
    ctx.quadraticCurveTo(0, -13, 6, -12);
    ctx.quadraticCurveTo(11, -6, 0, 8);
    ctx.closePath(); ctx.fill();
    // Sauce blush
    ctx.fillStyle = '#E53935';
    ctx.beginPath(); ctx.ellipse(0, -2, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    // Pepperoni
    ctx.fillStyle = '#C62828';
    ctx.beginPath(); ctx.arc(-5, -8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 2, 3.5, 0, Math.PI*2); ctx.fill();
    // Pepperoni dots
    ctx.fillStyle = '#8B0000';
    [-5,5,0].forEach((px,i) => {
      const py = i<2 ? -8 : 2;
      ctx.beginPath(); ctx.arc(px-1, py-1, 1, 0, Math.PI*2); ctx.fill();
    });

  } else if (obs.name === 'Pineapple') {
    // ── Cute pineapple ──
    // Leaves on top — fan of rounded leaves
    const leafCol = ['#388E3C','#43A047','#2E7D32'];
    [[-10,-28,-0.5],[-2,-32,0],[10,-28,0.5]].forEach(([lx,ly,rot],i) => {
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(rot);
      ctx.fillStyle = leafCol[i];
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Body — golden rounded rectangle
    ctx.fillStyle = '#F9A825';
    ctx.beginPath(); ctx.roundRect(-13, -18, 26, 34, 10); ctx.fill();
    // Texture grid
    ctx.strokeStyle = '#E65100'; ctx.lineWidth = 1.2;
    for (let row = -12; row < 14; row += 7)
      for (let col = -9; col < 12; col += 7) {
        ctx.beginPath(); ctx.roundRect(col, row, 5, 5, 2); ctx.stroke();
      }
    // Face — big cute eyes
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-5, -2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -3, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -3, 1.2, 0, Math.PI*2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#5D3000'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 4, 5, 0.2, Math.PI-0.2); ctx.stroke();
    // Rosy cheeks
    ctx.fillStyle = 'rgba(220,80,50,0.2)';
    ctx.beginPath(); ctx.ellipse(-8, 5, 4, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, 5, 4, 3, 0, 0, Math.PI*2); ctx.fill();

  } else if (obs.name === 'Red Boots') {
    // ── Cute cowboy boot ──
    // Shaft (tall part of boot)
    ctx.fillStyle = '#C0392B';
    ctx.beginPath(); ctx.roundRect(-10, -22, 22, 26, [8,8,0,0]); ctx.fill();
    // Shaft highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.roundRect(-7, -20, 8, 16, 5); ctx.fill();
    // Foot
    ctx.fillStyle = '#C0392B';
    ctx.beginPath(); ctx.roundRect(-12, 4, 28, 14, [0,0,6,6]); ctx.fill();
    // Toe — rounded
    ctx.beginPath(); ctx.ellipse(10, 11, 8, 7, 0, 0, Math.PI*2); ctx.fill();
    // Sole
    ctx.fillStyle = '#922B21';
    ctx.beginPath(); ctx.roundRect(-14, 14, 32, 6, 4); ctx.fill();
    // Decorative stitching line
    ctx.strokeStyle = '#E8A090'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(-7,-18); ctx.lineTo(-7, 3); ctx.stroke();
    ctx.setLineDash([]);
    // Star
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 13px serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', 4, -4);
  }

  ctx.restore();
}

function drawBoss(boss) {
  ctx.save();
  ctx.translate(boss.x, boss.y);
  if (boss.type === 1) {
    // Giant Goat
    const scale = 2;
    ctx.scale(scale, scale);
    ctx.fillStyle = '#757575';
    ctx.fillRect(0, 10, 55, 40);
    ctx.fillStyle = '#9e9e9e';
    ctx.fillRect(5, 0, 30, 26);
    ctx.fillStyle = '#616161';
    ctx.fillRect(8, -12, 6, 14);
    ctx.fillRect(24, -12, 6, 14);
    ctx.fillStyle = '#ff5722';
    ctx.fillRect(12, 7, 6, 6);
    ctx.fillRect(26, 7, 6, 6);
    ctx.fillStyle = '#eeeeee';
    ctx.fillRect(10, 22, 12, 10);
    ctx.fillStyle = '#616161';
    ctx.fillRect(4, 50, 10, 14);
    ctx.fillRect(18, 50, 10, 14);
    ctx.fillRect(30, 50, 10, 14);
    ctx.fillRect(44, 50, 10, 14);
  } else if (boss.type === 2) {
    // Giant Pumpkin
    ctx.fillStyle = '#bf360c';
    ctx.beginPath();
    ctx.ellipse(35, 45, 35, 42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e64a19';
    ctx.beginPath();
    ctx.ellipse(35, 45, 28, 36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(15, 35); ctx.lineTo(28, 45); ctx.lineTo(15, 55); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(55, 35); ctx.lineTo(42, 45); ctx.lineTo(55, 55); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 55); ctx.lineTo(48, 55); ctx.lineTo(35, 65); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(30, -10, 10, 18);
    // Costume hat
    ctx.fillStyle = '#e65100';
    ctx.fillRect(10, -22, 50, 14);
    ctx.fillRect(18, -40, 34, 22);
  } else if (boss.type === 3) {
    // Barney — dapper guy in a sharp suit
    // Legs
    ctx.fillStyle = '#0d47a1';
    ctx.fillRect(14, 82, 16, 26);
    ctx.fillRect(40, 82, 16, 26);
    // Shoes
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(22, 109, 12, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(48, 109, 12, 5, 0, 0, Math.PI*2); ctx.fill();
    // Suit jacket body
    ctx.fillStyle = '#0d47a1';
    ctx.beginPath();
    ctx.moveTo(10, 82); ctx.lineTo(10, 30); ctx.lineTo(35, 26); ctx.lineTo(60, 30); ctx.lineTo(60, 82);
    ctx.closePath(); ctx.fill();
    // White shirt front
    ctx.fillStyle = '#f5f5f5';
    ctx.beginPath();
    ctx.moveTo(28, 30); ctx.lineTo(35, 26); ctx.lineTo(42, 30); ctx.lineTo(42, 80); ctx.lineTo(28, 80);
    ctx.closePath(); ctx.fill();
    // Lapels
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.moveTo(28, 30); ctx.lineTo(10, 44); ctx.lineTo(10, 30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(42, 30); ctx.lineTo(60, 44); ctx.lineTo(60, 30); ctx.closePath(); ctx.fill();
    // Tie
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(33, 32); ctx.lineTo(37, 32); ctx.lineTo(39, 75); ctx.lineTo(35, 79); ctx.lineTo(31, 75);
    ctx.closePath(); ctx.fill();
    // Pocket square
    ctx.fillStyle = '#fff';
    ctx.fillRect(12, 38, 10, 8);
    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(13, 37, 8, 4);
    // Head (rounded)
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath(); ctx.ellipse(35, 16, 18, 17, 0, 0, Math.PI*2); ctx.fill();
    // Hair (short, brown, side-parted)
    ctx.fillStyle = '#795548';
    ctx.beginPath(); ctx.ellipse(35, 4, 18, 10, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(17, 4, 36, 6);
    // Side part
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(28, 8); ctx.lineTo(32, 8); ctx.lineTo(32, 0); ctx.closePath(); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(28, 17, 5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, 17, 5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.arc(29, 17, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(43, 17, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(30, 16, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(44, 16, 1.5, 0, Math.PI*2); ctx.fill();
    // Smirk
    ctx.strokeStyle = '#c9967a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(38, 24, 5, 0.1, Math.PI - 0.1); ctx.stroke();
    // Eyebrows (raised smugly)
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(24, 11); ctx.quadraticCurveTo(28, 9, 32, 11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(38, 11); ctx.quadraticCurveTo(42, 8, 46, 11); ctx.stroke();
  }
  ctx.restore();

  // Health bar
  const bw = 120;
  const bh = 12;
  const bx = boss.x + boss.w / 2 - bw / 2;
  const by = boss.y - 20;
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#e53935';
  ctx.fillRect(bx, by, bw * (boss.hp / boss.maxHp), bh);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP: ${boss.hp}/${boss.maxHp}`, bx + bw/2, by + 9);
}

function drawBossProjectile(proj) {
  ctx.save();
  ctx.translate(proj.x, proj.y);
  if (proj.type === 'pizza') {
    ctx.fillStyle = '#fdd835';
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(9, 9); ctx.lineTo(-9, 9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(6, 7); ctx.lineTo(-6, 7);
    ctx.closePath(); ctx.fill();
  } else if (proj.type === 'pineapple') {
    ctx.fillStyle = '#f9a825';
    ctx.beginPath(); ctx.arc(0, 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#388e3c';
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(-6, -12); ctx.lineTo(0, -6);
    ctx.lineTo(6, -12); ctx.closePath(); ctx.fill();
  } else if (proj.type === 'boot') {
    ctx.fillStyle = '#c62828';
    ctx.fillRect(-8, -5, 16, 8);
    ctx.fillRect(-8, 3, 8, 6);
    ctx.fillStyle = '#b71c1c';
    ctx.fillRect(-10, 7, 12, 3);
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, color,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 2) * 4,
      size: 4 + Math.random() * 6,
      alpha: 1
    });
  }
}

function spawnObstacle() {
  const pool = OBSTACLE_TYPES.filter(t => t.levels.includes(currentLevel));
  const typeDef = pool[Math.floor(Math.random() * pool.length)];
  // Vary height: most on ground, some higher
  const onGround = Math.random() > 0.25;
  const yOffset = onGround ? 0 : -(40 + Math.random() * 60);
  obstacles.push({
    x: 850,
    y: GROUND + 48 - typeDef.h + yOffset,
    w: typeDef.w,
    h: typeDef.h,
    name: typeDef.name,
    points: typeDef.points,
    typeDef,
    speed: gameSpeed + Math.random() * 1.5
  });
}

function spawnCollectible() {
  const yPos = GROUND - 20 - Math.random() * 100;
  collectibles.push({
    x: 850, y: yPos,
    w: 32, h: 40,
    speed: gameSpeed
  });
}

function spawnBoss(level) {
  const types = { 1: { type: 1, hp: 5, maxHp: 5, w: 110, h: 130, projType: 'pizza' },
                   2: { type: 2, hp: 5, maxHp: 5, w: 70, h: 100, projType: 'pineapple' },
                   3: { type: 3, hp: 5, maxHp: 5, w: 70, h: 110, projType: 'boot' } };
  const def = types[level];
  boss = {
    ...def,
    x: 600, y: GROUND + 48 - def.h,
    baseY: GROUND + 48 - def.h,
    vx: -1.5, vy: 0,
    projTimer: 0,
    bounceTimer: 0,
    hitFlash: 0,
    jumpTimer: 0
  };
}

function checkAABB(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function drawHUD() {
  // Score
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, 800, 35);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, 10, 22);
  // Level
  ctx.textAlign = 'center';
  ctx.fillText(LEVELS[currentLevel].name, 400, 22);
  // Lives (hearts)
  ctx.textAlign = 'right';
  let heartsStr = '';
  for (let i = 0; i < 3; i++) { heartsStr += i < lives ? '♥ ' : '♡ '; }
  ctx.fillStyle = i => i < lives ? '#e53935' : '#555';
  ctx.fillStyle = '#e53935';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#e53935' : '#444';
    ctx.font = '18px serif';
    ctx.fillText('♥', 780 - i * 22, 22);
  }
  // Horn count
  ctx.fillStyle = '#1e88e5';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`🎺 ${hornCount}`, 10, 50);
}

function drawStartScreen() {
  // Background
  ctx.fillStyle = '#0d1b2e';
  ctx.fillRect(0, 0, 800, 400);
  // Stars
  ctx.fillStyle = 'white';
  for (let i = 0; i < 80; i++) {
    const sx = (i * 173) % 800;
    const sy = (i * 97) % 300;
    ctx.fillRect(sx, sy, 2, 2);
  }
  // Blue horn decoration
  drawBlueHorn(100, 200);
  drawBlueHorn(680, 180);

  // Title
  ctx.fillStyle = '#1e88e5';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Blue French Horn', 400, 80);
  ctx.fillStyle = '#fdd835';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('Quest', 400, 115);
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '13px monospace';
  ctx.fillText('HIMYM Endless Runner', 400, 140);

  // High score
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(`High Score: ${getHighScore()}  |  Best Level: ${getHighLevel()}`, 400, 165);

  // Character select
  ctx.fillStyle = '#e0e0e0';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('Choose Your Character:', 400, 210);

  // Ted button
  const tedSel = selectedChar === 'ted';
  ctx.fillStyle = tedSel ? 'rgba(21,101,192,0.35)' : 'rgba(21,101,192,0.12)';
  ctx.strokeStyle = tedSel ? '#ffd700' : '#3a6fa8';
  ctx.lineWidth = tedSel ? 3 : 1;
  ctx.beginPath(); ctx.roundRect(258, 218, 126, 80, 12); ctx.fill(); ctx.stroke();
  // Mini cartoon Ted
  ctx.save(); ctx.scale(0.55, 0.55); ctx.translate(200, 340);
  drawCartoonChar(0, 0, true, false);
  ctx.restore();
  ctx.fillStyle = 'white'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Ted', 321, 278);
  if (tedSel) { ctx.fillStyle = '#ffd700'; ctx.font = '10px monospace'; ctx.fillText('✓ Selected', 321, 292); }

  // Robin button
  const robSel = selectedChar === 'robin';
  ctx.fillStyle = robSel ? 'rgba(198,40,40,0.35)' : 'rgba(198,40,40,0.12)';
  ctx.strokeStyle = robSel ? '#ffd700' : '#8b2020';
  ctx.lineWidth = robSel ? 3 : 1;
  ctx.beginPath(); ctx.roundRect(416, 218, 126, 80, 12); ctx.fill(); ctx.stroke();
  // Mini cartoon Robin
  ctx.save(); ctx.scale(0.55, 0.55); ctx.translate(890, 340);
  drawCartoonChar(0, 0, false, false);
  ctx.restore();
  ctx.fillStyle = 'white'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Robin', 479, 278);
  if (robSel) { ctx.fillStyle = '#ffd700'; ctx.font = '10px monospace'; ctx.fillText('✓ Selected', 479, 292); }

  // Instructions
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('Press SPACE to Start', 400, 330);
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '12px monospace';
  ctx.fillText('SPACE = Jump  |  SPACE×2 = Super Jump  |  ↓ = Duck', 400, 355);
  ctx.fillText('Collect Blue Horns  |  Avoid Obstacles  |  Defeat Bosses!', 400, 375);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, 800, 400);
  ctx.fillStyle = '#e53935';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', 400, 130);
  ctx.fillStyle = '#fdd835';
  ctx.font = 'bold 22px monospace';
  ctx.fillText(`Score: ${score}`, 400, 185);
  const hs = getHighScore();
  ctx.fillStyle = score >= hs ? '#ffd700' : '#aaaaaa';
  ctx.font = '18px monospace';
  ctx.fillText(`High Score: ${hs}`, 400, 220);
  if (score >= hs && score > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('NEW HIGH SCORE! Legendary!', 400, 248);
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px monospace';
  ctx.fillText(`Horns Collected: ${hornCount}  |  Level: ${LEVELS[currentLevel].name}`, 400, 278);
  // Play again button
  ctx.fillStyle = '#1565c0';
  ctx.beginPath();
  ctx.roundRect(300, 305, 200, 50, 10);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('Play Again', 400, 337);
  ctx.fillStyle = '#888';
  ctx.font = '13px monospace';
  ctx.fillText('Press SPACE to restart', 400, 378);
}

function drawBossIntro() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, 800, 400);
  ctx.fillStyle = '#e53935';
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'center';
  const bossNames = { 1: 'BOSS: The Goat!', 2: 'BOSS: Slutty Pumpkin!', 3: 'BOSS: Barney Stinson!' };
  ctx.fillText(bossNames[currentLevel] || 'BOSS!', 400, 180);
  ctx.fillStyle = 'white';
  ctx.font = '16px monospace';
  ctx.fillText('Jump on the boss 5 times to defeat it!', 400, 220);
}

let endingTimer = 0;
let endingStep = 0; // 0=walking in, 1=meeting, 2=horn offered, 3=fade

function transitionToNextLevel() {
  if (currentLevel === 3) {
    // Final boss beaten — trigger ending cutscene
    obstacles = [];
    collectibles = [];
    bossProjectiles = [];
    boss = null;
    bossPhase = false;
    endingTimer = 0;
    endingStep = 0;
    state = STATES.ENDING;
    return;
  }
  currentLevel++;
  gameSpeed += 0.5;
  obstacles = [];
  collectibles = [];
  bossProjectiles = [];
  boss = null;
  bossPhase = false;
  initParallax(currentLevel);
  state = STATES.PLAYING;
}

function drawEnding() {
  // NYC night background
  ctx.fillStyle = '#0a0f1e';
  ctx.fillRect(0, 0, 800, 400);
  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137) % 800, sy = (i * 79) % 220;
    ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.6 * Math.abs(Math.sin(i))})`;
    ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI*2); ctx.fill();
  }
  // Buildings silhouette with gradient
  const bldgs = [[0,120,80,280],[90,80,100,320],[200,150,70,250],[280,60,90,340],[380,100,80,300],[470,140,100,260],[580,90,70,310],[660,130,80,270],[750,50,50,350]];
  bldgs.forEach(([bx,by,bw,bh]) => {
    const bg = ctx.createLinearGradient(bx, by, bx, by+bh);
    bg.addColorStop(0, '#1e2640'); bg.addColorStop(1, '#141928');
    ctx.fillStyle = bg; ctx.fillRect(bx, by, bw, bh);
    // Windows
    for (let wy = by+10; wy < by+bh-15; wy += 18)
      for (let wx = bx+8; wx < bx+bw-8; wx += 14)
        if (Math.sin(wx*wy) > -0.3) { ctx.fillStyle='rgba(255,220,100,0.7)'; ctx.fillRect(wx,wy,6,8); }
  });
  // Street gradient
  const streetG = ctx.createLinearGradient(0,325,0,400);
  streetG.addColorStop(0,'#2a3040'); streetG.addColorStop(1,'#1a2030');
  ctx.fillStyle = streetG; ctx.fillRect(0, 325, 800, 75);
  ctx.fillStyle = '#3a4555'; ctx.fillRect(0, 323, 800, 5);
  // Street center line
  for (let i=0; i<800; i+=60) { ctx.fillStyle='rgba(255,220,50,0.3)'; ctx.fillRect(i,360,40,4); }

  const t = endingTimer;
  const partnerName = selectedChar === 'ted' ? 'Robin' : 'Ted';
  const playerName  = selectedChar === 'ted' ? 'Ted'   : 'Robin';

  // Player walks in from left
  const playerCX = -40 + Math.min(t / 90, 1) * 380;
  drawCartoonChar(playerCX, 270, selectedChar === 'ted', false);

  // Partner walks in from right (starts at frame 60)
  if (t >= 60) {
    const partnerCX = 860 + Math.min((t - 60) / 90, 1) * (500 - 860);
    drawCartoonChar(partnerCX, 270, selectedChar !== 'ted', false);
  }

  // Horn floats between them (frame 150+)
  if (t >= 150) {
    const hornBob = Math.sin(t * 0.08) * 5;
    drawBlueHorn(390, 255 + hornBob);
    // Speech bubble
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.roundRect(250, 175, 300, 60, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 12px Georgia,serif'; ctx.textAlign = 'center';
    const line1 = selectedChar === 'ted' ? '"Robin… I got this for you."' : '"Ted… you came for me."';
    const line2 = selectedChar === 'ted' ? '"I searched every level for you."' : '"You searched every level for me."';
    ctx.fillText(line1, 400, 200); ctx.fillText(line2, 400, 220);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.moveTo(370,235); ctx.lineTo(390,255); ctx.lineTo(410,235); ctx.closePath(); ctx.fill();
  }

  // Fade to title card (frame 260+)
  if (t >= 260) {
    const alpha = Math.min((t - 260) / 70, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#0a0f1e'; ctx.fillRect(0,0,800,400);
    ctx.fillStyle = '#1e88e5'; ctx.font = 'bold 34px Georgia,serif'; ctx.textAlign = 'center';
    ctx.fillText('And that, kids…', 400, 130);
    ctx.fillStyle = '#fdd835';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(`is how ${playerName} met ${partnerName}.`, 400, 180);
    // Blue horns
    drawBlueHorn(280, 230);
    drawBlueHorn(480, 230);
    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.fillText(`Score: ${score}  |  Horns: ${hornCount}`, 400, 300);
    ctx.fillStyle = '#aaaaaa';
    ctx.font = '13px monospace';
    ctx.fillText('Press SPACE to play again', 400, 340);
    ctx.globalAlpha = 1;
  } else {
    // Show score in corner
    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 10, 20);
  }
}

// Play again button click on game over screen
canvas.addEventListener('click', e => {
  if (state === STATES.GAME_OVER) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * (400 / rect.height);
    if (mx > 300 && mx < 500 && my > 305 && my < 355) startGame();
  }
});

let bossIntroTimer = 0;
let showBossIntro = false;

function triggerBoss() {
  bossPhase = true;
  showBossIntro = true;
  bossIntroTimer = 120;
  spawnBoss(currentLevel);
  state = STATES.BOSS;
}

function update(dt) {
  frameCount++;
  scrollX += gameSpeed;

  // Update parallax
  // (scroll handled in draw via modulo)

  // Player physics
  if (!player.onGround) {
    player.vy += 0.7;
    player.y += player.vy;
    if (player.y >= GROUND) {
      player.y = GROUND;
      player.vy = 0;
      player.onGround = true;
      jumpsUsed = 0;
    }
  }

  // Ducking
  if (duckPressed && player.onGround) {
    player.ducking = true;
  } else if (!duckPressed) {
    player.ducking = false;
  }

  // Invincibility
  if (invincible) {
    invincibleTimer -= dt;
    if (invincibleTimer <= 0) { invincible = false; flashRed = false; }
  }

  if (state === STATES.PLAYING) {
    // Spawn obstacles
    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      obstacleTimer = 1800 + Math.random() * 1200;
    }
    // Spawn collectibles
    collectibleTimer -= dt;
    if (collectibleTimer <= 0) {
      spawnCollectible();
      collectibleTimer = 1500 + Math.random() * 1500;
    }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= obs.speed;
      if (obs.x + obs.w < -10) { obstacles.splice(i, 1); continue; }
      // Collision
      const playerH = player.ducking ? 30 : player.h;
      const playerY = player.ducking ? player.y + (player.h - 30) : player.y;
      const pbox = { x: player.x + 4, y: playerY + 4, w: player.w - 8, h: playerH - 8 };
      const obox = { x: obs.x + 4, y: obs.y + 4, w: obs.w - 8, h: obs.h - 8 };
      if (!invincible && checkAABB(pbox, obox)) {
        score = Math.max(0, score + obs.points);
        invincible = true;
        invincibleTimer = 1500;
        flashRed = true;
        sfxHit();
        spawnParticles(obs.x + obs.w/2, obs.y, '#e53935', 8);
        lives--;
        obstacles.splice(i, 1);
        if (lives <= 0) {
          saveProgress(score, currentLevel);
          sfxGameOver();
          state = STATES.GAME_OVER;
          return;
        }
      }
    }

    // Move collectibles
    for (let i = collectibles.length - 1; i >= 0; i--) {
      const col = collectibles[i];
      col.x -= col.speed;
      if (col.x + col.w < -10) { collectibles.splice(i, 1); continue; }
      const pbox = { x: player.x + 2, y: player.y + 2, w: player.w - 4, h: player.h - 4 };
      const cbox = { x: col.x, y: col.y, w: col.w, h: col.h };
      if (checkAABB(pbox, cbox)) {
        score += 25;
        hornCount++;
        sfxCollect();
        spawnParticles(col.x + 16, col.y, '#1e88e5', 10);
        collectibles.splice(i, 1);
        continue;
      }
    }

    // Score increases over time
    if (frameCount % 30 === 0) score++;

    // Check level transitions
    if (currentLevel === 1 && score > 500) {
      triggerBoss();
    } else if (currentLevel === 2 && score > 1200) {
      triggerBoss();
    } else if (currentLevel === 3 && score > 2000) {
      triggerBoss();
    }

    // Speed up over time
    if (frameCount % 900 === 0) gameSpeed = Math.min(gameSpeed + 0.2, 6);
  }

  if (state === STATES.BOSS) {
    if (showBossIntro) {
      bossIntroTimer -= dt;
      if (bossIntroTimer <= 0) showBossIntro = false;
    }

    if (boss && !showBossIntro) {
      // Boss movement
      if (boss.type === 1) {
        // Goat: bounces left-right
        boss.x += boss.vx * 2;
        if (boss.x < 400) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > 780) boss.vx = -Math.abs(boss.vx);
      } else if (boss.type === 2) {
        // Pumpkin: jumps
        boss.x += boss.vx;
        if (boss.x < 400) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > 780) boss.vx = -Math.abs(boss.vx);
        boss.vy += 0.5;
        boss.y += boss.vy;
        if (boss.y >= boss.baseY) {
          boss.y = boss.baseY;
          boss.vy = -frameCount % 120 < 60 ? -10 : 0;
        }
      } else if (boss.type === 3) {
        // Barney: moves back and forth
        boss.x += boss.vx * 1.5;
        if (boss.x < 420) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > 780) boss.vx = -Math.abs(boss.vx);
      }

      // Boss projectiles
      boss.projTimer -= dt;
      if (boss.projTimer <= 0) {
        bossProjectiles.push({
          x: boss.x, y: boss.y + boss.h/2,
          vx: -5, vy: -3 + Math.random() * 2,
          type: boss.projType
        });
        boss.projTimer = 1200 + Math.random() * 800;
      }

      // Move projectiles
      for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        const proj = bossProjectiles[i];
        proj.x += proj.vx;
        proj.vy += 0.2;
        proj.y += proj.vy;
        if (proj.x < -20 || proj.y > 420) { bossProjectiles.splice(i, 1); continue; }
        // Collision with player
        const pbox = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
        const prbox = { x: proj.x - 10, y: proj.y - 10, w: 20, h: 20 };
        if (!invincible && checkAABB(pbox, prbox)) {
          score = Math.max(0, score - 20);
          invincible = true;
          invincibleTimer = 1500;
          flashRed = true;
          sfxHit();
          lives--;
          bossProjectiles.splice(i, 1);
          if (lives <= 0) {
            saveProgress(score, currentLevel);
            sfxGameOver();
            state = STATES.GAME_OVER;
            return;
          }
        }
      }

      // Player jumping on boss
      const bossBox = { x: boss.x + 5, y: boss.y, w: boss.w - 10, h: 15 };
      const playerFeet = { x: player.x + 4, y: player.y + player.h - 5, w: player.w - 8, h: 10 };
      if (player.vy > 0 && checkAABB(playerFeet, bossBox)) {
        boss.hp--;
        sfxBossHit();
        player.vy = -10;
        spawnParticles(boss.x + boss.w/2, boss.y, '#fdd835', 12);
        boss.hitFlash = 15;
        if (boss.hp <= 0) {
          sfxBossDie();
          spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd700', 30);
          saveProgress(score, currentLevel);
          score += 100;
          transitionToNextLevel();
        }
      }

      if (boss.hitFlash > 0) boss.hitFlash--;
    }
  }

  // Ending cutscene update
  if (state === STATES.ENDING) {
    endingTimer++;
    if (endingTimer >= 300 && (keys['Space'] || keys['ArrowUp'])) {
      startGame();
    }
    return;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= 0.03;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, 800, 400);

  if (state === STATES.START) {
    drawStartScreen();
    return;
  }

  if (state === STATES.GAME_OVER) {
    drawBackground(currentLevel);
    drawParallax(currentLevel);
    drawGround(currentLevel);
    drawGameOver();
    return;
  }

  if (state === STATES.ENDING) {
    drawEnding();
    return;
  }

  // Game background
  drawBackground(currentLevel);
  drawParallax(currentLevel);
  drawGround(currentLevel);

  // Flash red on hit
  if (flashRed && invincible) {
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(0, 0, 800, 400);
  }

  // Draw collectibles
  collectibles.forEach(col => {
    drawBlueHorn(col.x + 16, col.y + 20);
  });

  // Draw obstacles
  obstacles.forEach(obs => drawObstacle(obs));

  // Draw boss
  if (boss) {
    if (boss.hitFlash > 0 && Math.floor(boss.hitFlash / 3) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }
    drawBoss(boss);
    ctx.globalAlpha = 1;
  }

  // Boss projectiles
  bossProjectiles.forEach(proj => drawBossProjectile(proj));

  // Draw player
  drawPlayer();

  // Particles
  drawParticles();

  // HUD
  drawHUD();

  // Boss intro overlay
  if (showBossIntro) {
    drawBossIntro();
  }
}

let lastTime = 0;
function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// Init
initParallax(1);
requestAnimationFrame(gameLoop);
</script>
