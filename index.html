const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive scaling
function resize() {
  const scale = Math.min(window.innerWidth / 400, window.innerHeight / 600);
  canvas.style.width = (400 * scale) + 'px';
  canvas.style.height = (600 * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Web Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

window.addEventListener('keydown', e => {

  if (e.code === 'Space' && state === STATES.ENDING && endingTimer >= 300) startGame();
  e.preventDefault();
});
window.addEventListener('keyup', e => {

  if (e.code === 'ArrowUp' || e.code === 'Space') jumpPressed = false;

});

// Touch — two quick taps = double jump
let lastTapTime = 0;
canvas.addEventListener('touchstart', e => {
  if (state === STATES.START) { startGame(); e.preventDefault(); return; }
  if (state === STATES.GAME_OVER) { startGame(); e.preventDefault(); return; }
  if (state === STATES.PLAYING || state === STATES.BOSS) {
    const rect = canvas.getBoundingClientRect();
    const tx = (e.touches[0].clientX - rect.left) / rect.width;
    if (state === STATES.BOSS && tx > 0.5) {
      // Right half of screen = throw horn
      throwHorn();
    } else {
      const now = performance.now();
      const isDouble = (now - lastTapTime) < 300 && jumpsUsed === 1;
      lastTapTime = now;
      handleJump(isDouble);
    }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  player.ducking = false;
  e.preventDefault();
}, { passive: false });

let swordSwingTimer = 0; // >0 = sword visible, counts down

function throwHorn() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = performance.now();
  if (now - throwCooldown < THROW_COOLDOWN_MS) return;
  throwCooldown = now;
  // Sword slash — short fast projectile
  playerProjectiles.push({
    x: player.x + player.w,
    y: player.y + 4,
    vx: 14,
    vy: 0,
    w: 40, h: 12,
    isSword: true
  });
  swordSwingTimer = 18; // show swing animation for ~18 frames
  playSound(400, 'sawtooth', 0.15, 0.08);
  playSound(600, 'sawtooth', 0.1, 0.06);
}

function handleJump(isDouble) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (state === STATES.PLAYING || state === STATES.BOSS) {
    if (player.onGround && !player.ducking) {
      // Normal jump
      player.vy = -14;
      player.onGround = false;
      jumpsUsed = 1;
      sfxJump();
    } else if (isDouble && jumpsUsed === 1) {
      // Double jump — bigger boost, higher pitch sound
      player.vy = -20;
      jumpsUsed = 2;
      playSound(600, 'sine', 0.18, 0.14);
      playSound(900, 'sine', 0.12, 0.1);
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#fdd835', 6);
    }
  }
}

    ctx.fillRect(0, 473, 400, 127);

    ctx.fillRect(0, 473, 400, 12);
    // Ceiling trim
    ctx.fillStyle = '#a0714a';
    ctx.fillRect(0, 0, 400, 18);
  } else if (level === 2) {
    // MacLaren's Bar
    ctx.fillStyle = '#1a0d08';
    ctx.fillRect(0, 0, 400, 480);
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(0, 300, 400, 180);
    // Bar top
    ctx.fillStyle = '#3e2010';
    ctx.fillRect(0, 398, 400, 30);
    ctx.fillStyle = '#5c3020';
    ctx.fillRect(0, 395, 400, 8);
    // Floor
    ctx.fillStyle = '#1a0d08';
    ctx.fillRect(0, 473, 400, 127);
    // Ambient light
    ctx.fillStyle = 'rgba(255,180,60,0.04)';
    ctx.fillRect(0, 0, 400, 480);
  } else if (level === 3) {
    // NYC Street
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(0, 0, 400, 390);
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(0, 473, 400, 127);
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(0, 468, 400, 12);
    ctx.fillStyle = '#d1d5db';
    for (let i = 0; i < 400; i += 40) {
      ctx.fillRect(((i - scrollX * 0.8) % 400 + 400) % 400, 480, 20, 3);
    }
  } else if (level === 4) {
    // Halloween Party — deep purple night
    const hgrd = ctx.createLinearGradient(0, 0, 0, 480);
    hgrd.addColorStop(0, '#0d0020'); hgrd.addColorStop(1, '#2a0a3a');
    ctx.fillStyle = hgrd; ctx.fillRect(0, 0, 400, 480);
    // Moon
    ctx.fillStyle = '#FFF9C4';
    ctx.shadowColor = '#FFF176'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(680, 60, 38, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a0a2e'; ctx.beginPath(); ctx.arc(695, 52, 33, 0, Math.PI*2); ctx.fill();
    // Stars
    for (let i = 0; i < 50; i++) {
      ctx.fillStyle = `rgba(255,255,200,${0.3 + 0.7*Math.abs(Math.sin(i*7+frameCount*0.02))})`;
      ctx.fillRect((i*173)%400, (i*97)%300, 2, 2);
    }
    // Floor — dark wood
    ctx.fillStyle = '#1a0a10'; ctx.fillRect(0, 473, 400, 127);
    ctx.fillStyle = '#2d1520';
    for (let i = 0; i < 400; i += 30) {
      ctx.fillRect(((i - scrollX * 0.9) % 450 + 450) % 450, 480, 2, 115);
    }
  } else if (level === 5) {
    // Farhampton — golden sunset
    const sgrd = ctx.createLinearGradient(0, 0, 0, 480);

    ctx.fillStyle = sgrd; ctx.fillRect(0, 0, 400, 480);
    // Sun
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(200, 270, 45, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Horizon grass strip
    ctx.fillStyle = '#8B7355'; ctx.fillRect(0, 442, 400, 38);
    ctx.fillStyle = '#6B5B45'; ctx.fillRect(0, 473, 400, 127);

    ctx.fillStyle = '#7B6B55';
    for (let i = 0; i < 400; i += 25) {
      ctx.fillRect(((i - scrollX) % 450 + 450) % 450, 450, 2, 27);

  }
}

function drawParallax(level) {
  parallaxLayers.forEach(layer => {
    const px = ((layer.x - scrollX * layer.speed) % 1200 + 1200) % 1200;
    if (level === 1) {
      if (layer.type === 'window') {
        ctx.fillStyle = '#d4a574';
        ctx.fillRect(px, layer.y, 60, 80);
        ctx.fillStyle = '#87ceeb';
        ctx.fillRect(px + 5, layer.y + 5, 50, 70);
        // Window panes
        ctx.strokeStyle = '#d4a574';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + 30, layer.y + 5);
        ctx.lineTo(px + 30, layer.y + 75);
        ctx.moveTo(px + 5, layer.y + 40);
        ctx.lineTo(px + 55, layer.y + 40);
        ctx.stroke();
        // Window sill
        ctx.fillStyle = '#8b5e3c';
        ctx.fillRect(px - 3, layer.y + 75, 66, 6);
      }
    } else if (level === 2) {
      if (layer.type === 'stool') {
        // Bar stool
        ctx.fillStyle = '#3e2010';
        ctx.fillRect(px, layer.y, 30, 5);
        ctx.fillStyle = '#5c3020';
        ctx.fillRect(px + 12, layer.y + 5, 6, 50);
        ctx.fillStyle = '#4a2c1a';
        ctx.fillRect(px + 4, layer.y + 55, 22, 5);
      } else if (layer.type === 'bottle') {
        // Bottle on shelf
        ctx.fillStyle = '#2d5a1b';
        ctx.fillRect(px, layer.y, 12, 35);
        ctx.fillStyle = '#1d3d12';
        ctx.fillRect(px + 3, layer.y - 8, 6, 10);
        ctx.fillStyle = '#8b7355';
        ctx.fillRect(0, layer.y + 35, 400, 6);
      }
    } else if (level === 3) {
      if (layer.type === 'building') {
        // Anchor building bottom to ground; layer.h is building height
        const bTop = GROUND + 48 - layer.h;
        ctx.fillStyle = '#374151';
        ctx.fillRect(px, bTop, layer.w, layer.h);
        ctx.fillStyle = '#fbbf24';
        for (let wy = bTop + 10; wy < bTop + layer.h - 10; wy += 20)
          for (let wx = px + 8; wx < px + layer.w - 8; wx += 16)
            if (Math.random() > 0.3) ctx.fillRect(wx, wy, 8, 10);
      }
    } else if (level === 4) {
      if (layer.type === 'bat') {
        // Cute cartoon bat
        const bx = px, by = layer.y + Math.sin(frameCount * 0.06 + layer.x) * 12;
        ctx.fillStyle = '#3d0066';
        // Wings
        ctx.beginPath(); ctx.ellipse(bx - 14, by, 14, 7, -0.4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx + 14, by, 14, 7,  0.4, 0, Math.PI*2); ctx.fill();
        // Body
        ctx.fillStyle = '#5a009a';
        ctx.beginPath(); ctx.ellipse(bx, by, 8, 6, 0, 0, Math.PI*2); ctx.fill();
        // Ears
        ctx.fillStyle = '#3d0066';
        ctx.beginPath(); ctx.moveTo(bx-5,by-6); ctx.lineTo(bx-8,by-13); ctx.lineTo(bx-2,by-6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(bx+5,by-6); ctx.lineTo(bx+8,by-13); ctx.lineTo(bx+2,by-6); ctx.fill();
        // Eyes
        ctx.fillStyle = '#FF0000';
        ctx.beginPath(); ctx.arc(bx-3,by-1,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx+3,by-1,2,0,Math.PI*2); ctx.fill();
      } else if (layer.type === 'lantern') {
        // Jack-o-lantern on ground
        ctx.fillStyle = '#E65100';
        ctx.beginPath(); ctx.ellipse(px + 18, layer.y, 18, 16, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#BF360C';
        ctx.beginPath(); ctx.ellipse(px + 18, layer.y + 4, 12, 10, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#5D4037';
        ctx.beginPath(); ctx.roundRect(px + 15, layer.y - 16, 6, 8, 3); ctx.fill();
        ctx.fillStyle = '#FFD600';
        // Triangle eyes
        ctx.beginPath(); ctx.moveTo(px+10,layer.y-6); ctx.lineTo(px+14,layer.y-1); ctx.lineTo(px+6,layer.y-1); ctx.fill();
        ctx.beginPath(); ctx.moveTo(px+26,layer.y-6); ctx.lineTo(px+30,layer.y-1); ctx.lineTo(px+22,layer.y-1); ctx.fill();
        // Smile
        ctx.beginPath(); ctx.moveTo(px+10,layer.y+6); ctx.lineTo(px+12,layer.y+10); ctx.lineTo(px+16,layer.y+7); ctx.lineTo(px+20,layer.y+10); ctx.lineTo(px+24,layer.y+7); ctx.lineTo(px+26,layer.y+6); ctx.stroke();
      }
    } else if (level === 5) {
      if (layer.type === 'cloud') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.ellipse(px+20, layer.y, 30, 16, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px+38, layer.y+5, 22, 13, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px+5, layer.y+6, 18, 12, 0, 0, Math.PI*2); ctx.fill();
      } else if (layer.type === 'tie') {
        // Rail tie (horizontal beam under tracks)
        ctx.fillStyle = '#5C4033';
        ctx.fillRect(px, layer.y, 45, 8);
      }
    }
  });
}

function drawCartoonChar(cx, baseY, isTed, ducking) {
  ctx.save();

  const H      = ducking ? 36 : 58;  // total height
  const headR  = 13;
  const headCY = baseY + headR;
  const bodyY  = headCY + headR - 2;
  const bodyH  = ducking ? 14 : 26;
  const legY   = bodyY + bodyH;

  // ── shared skin colour ──
  const skin = '#FACBA0';
  const skinDark = '#E8A87C';

  if (isTed) {
    /* LEGS */
    if (!ducking) {
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.roundRect(cx - 12, legY, 10, 18, [0,0,4,4]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx + 2,  legY, 10, 18, [0,0,4,4]); ctx.fill();
      // shoes
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(cx - 7,  legY + 18, 9, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 7,  legY + 18, 9, 4, 0, 0, Math.PI*2); ctx.fill();
    }

    /* BODY — blue jacket */
    ctx.fillStyle = '#2176C7';
    ctx.beginPath(); ctx.roundRect(cx - 15, bodyY, 30, bodyH, [3,3,6,6]); ctx.fill();
    // shirt + tie strip
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(cx - 3, bodyY, 6, bodyH);
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.moveTo(cx-2, bodyY+1); ctx.lineTo(cx+2, bodyY+1);
    ctx.lineTo(cx+3, bodyY+bodyH-4); ctx.lineTo(cx, bodyY+bodyH-1); ctx.lineTo(cx-3, bodyY+bodyH-4);
    ctx.closePath(); ctx.fill();

    /* HEAD */
    // ears
    ctx.fillStyle = skinDark;
    ctx.beginPath(); ctx.ellipse(cx-headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    // face
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(cx, headCY, headR, 0, Math.PI*2); ctx.fill();
    // hair — warm brown cap
    ctx.fillStyle = '#7B4F2E';
    ctx.beginPath(); ctx.arc(cx, headCY, headR, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 4, headCY - headR + 3, 10, 7, -0.3, Math.PI, Math.PI*2); ctx.fill();
    // eyebrows
    ctx.strokeStyle = '#5a3010'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(cx-5, headCY-2, 4, Math.PI+0.3, Math.PI*2-0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+5, headCY-2, 4, Math.PI+0.3, Math.PI*2-0.3); ctx.stroke();
    // eyes — white + iris + pupil
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx-5, headCY+2, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+5, headCY+2, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6B4226';
    ctx.beginPath(); ctx.arc(cx-5, headCY+2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5, headCY+2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx-5, headCY+2, 1.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5, headCY+2, 1.1, 0, Math.PI*2); ctx.fill();
    // catchlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx-4, headCY+1, 0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, headCY+1, 0.6, 0, Math.PI*2); ctx.fill();
    // rosy cheeks
    ctx.fillStyle = 'rgba(240,130,100,0.22)';
    ctx.beginPath(); ctx.ellipse(cx-9, headCY+5, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+9, headCY+5, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    // smile
    ctx.strokeStyle = '#b5673a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, headCY+6, 5, 0.15, Math.PI-0.15); ctx.stroke();

  } else {
    /* LEGS */
    if (!ducking) {
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(cx - 11, legY, 9, 18, [0,0,4,4]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx + 2,  legY, 9, 18, [0,0,4,4]); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(cx - 6,  legY + 18, 8, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 6,  legY + 18, 8, 4, 0, 0, Math.PI*2); ctx.fill();
    }

    /* BODY — red top */
    ctx.fillStyle = '#C0392B';
    ctx.beginPath(); ctx.roundRect(cx - 14, bodyY, 28, bodyH, [3,3,6,6]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.ellipse(cx, bodyY+2, 7, 4, 0, Math.PI, Math.PI*2); ctx.fill();

    /* HEAD — draw ears first, then face */
    ctx.fillStyle = skinDark;
    ctx.beginPath(); ctx.ellipse(cx - headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();

    // Face — slightly oval (taller than wide), feminine
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(cx, headCY + 1, headR - 1, headR + 1, 0, 0, Math.PI*2); ctx.fill();

    // Hair top — dark cap sitting ON TOP of head
    ctx.fillStyle = '#2C1810';
    ctx.beginPath(); ctx.ellipse(cx, headCY - 4, headR, 9, 0, Math.PI, Math.PI*2); ctx.fill();
    // Side hair — two smooth strands framing the face (not wrapping under chin)
    ctx.beginPath(); ctx.ellipse(cx - headR - 1, headCY + 4, 5, 12, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headR + 1, headCY + 4, 5, 12,  0.15, 0, Math.PI*2); ctx.fill();

    // Eyebrows — thin, high, arched
    ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx - 5, headCY - 3, 4.5, Math.PI + 0.5, Math.PI*2 - 0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 5, headCY - 3, 4.5, Math.PI + 0.5, Math.PI*2 - 0.5); ctx.stroke();

    // Eyes — big, almond-shaped
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx - 5, headCY + 2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 5, headCY + 2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    // Iris — blue-grey
    ctx.fillStyle = '#4A6FA5';
    ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
    // Catchlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 4, headCY + 1.5, 0.7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 6, headCY + 1.5, 0.7, 0, Math.PI*2); ctx.fill();
    // Lashes — top lid only, short strokes fanning up
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2;
    [[-5,0],[-3,-0.5],[-1,-1],[1,-0.5]].forEach(([dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx - 5 + dx*0.6, headCY - 1.5 + dy);
      ctx.lineTo(cx - 5 + dx, headCY - 4 + dy);
      ctx.stroke();
    });
    [[5,0],[3,-0.5],[1,-1],[-1,-0.5]].forEach(([dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + 5 + dx*0.6, headCY - 1.5 + dy);
      ctx.lineTo(cx + 5 + dx, headCY - 4 + dy);
      ctx.stroke();
    });

    // Rosy cheeks
    ctx.fillStyle = 'rgba(240,120,100,0.22)';
    ctx.beginPath(); ctx.ellipse(cx - 9, headCY + 6, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 9, headCY + 6, 5, 3, 0, 0, Math.PI*2); ctx.fill();

    // Lips — clearly pink, two-tone
    ctx.fillStyle = '#E05C6A';
    ctx.beginPath(); ctx.ellipse(cx, headCY + 9, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F4A0A8';
    ctx.beginPath(); ctx.ellipse(cx, headCY + 8, 3.5, 1.5, 0, 0, Math.PI); ctx.fill();
  }

  ctx.restore();
}

function drawTracy(cx, baseY) {
  ctx.save();

  const headR  = 13;
  const headCY = baseY + headR;
  const bodyY  = headCY + headR - 2;
  const bodyH  = 20;
  const skirtY = bodyY + bodyH;
  const skin   = '#FACBA0';
  const skinDk = '#E8A87C';

  // Bare legs peeking under short skirt
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.roundRect(cx - 9, skirtY + 14, 7, 10, [0,0,3,3]); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx + 2, skirtY + 14, 7, 10, [0,0,3,3]); ctx.fill();
  ctx.fillStyle = '#C62828';
  ctx.beginPath(); ctx.ellipse(cx - 5.5, skirtY + 24, 7, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 5.5, skirtY + 24, 7, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.roundRect(cx - 9, skirtY + 20, 7, 3, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx + 2, skirtY + 20, 7, 3, 1); ctx.fill();

  // Short A-line skirt
  ctx.fillStyle = '#FFCA28';
  ctx.beginPath();
  ctx.moveTo(cx - 13, skirtY);
  ctx.quadraticCurveTo(cx - 20, skirtY + 8, cx - 18, skirtY + 18);
  ctx.lineTo(cx + 18, skirtY + 18);
  ctx.quadraticCurveTo(cx + 20, skirtY + 8, cx + 13, skirtY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFE57F';
  ctx.beginPath();
  ctx.moveTo(cx - 3, skirtY);
  ctx.quadraticCurveTo(cx - 4, skirtY + 9, cx - 3, skirtY + 17);
  ctx.lineTo(cx + 3, skirtY + 17);
  ctx.quadraticCurveTo(cx + 4, skirtY + 9, cx + 3, skirtY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F9A825';
  ctx.beginPath();
  ctx.moveTo(cx + 7, skirtY);
  ctx.quadraticCurveTo(cx + 18, skirtY + 8, cx + 18, skirtY + 18);
  ctx.lineTo(cx + 13, skirtY + 18);
  ctx.quadraticCurveTo(cx + 12, skirtY + 9, cx + 7, skirtY);
  ctx.closePath(); ctx.fill();

  // Bodice with cap sleeves
  ctx.fillStyle = '#FFB300';
  ctx.beginPath(); ctx.roundRect(cx - 12, bodyY, 24, bodyH, [4,4,0,0]); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx - 14, bodyY + 4, 5, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 14, bodyY + 4, 5, 4,  0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFD54F';
  ctx.beginPath(); ctx.roundRect(cx - 6, bodyY + 2, 12, bodyH - 5, 3); ctx.fill();
  ctx.fillStyle = '#E65100';
  ctx.beginPath(); ctx.arc(cx - 4, bodyY + 3, 3, 0.5, Math.PI - 0.5); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 4, bodyY + 3, 3, 0.5 + Math.PI, Math.PI*2 - 0.5); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, bodyY + 3, 2, 0, Math.PI*2); ctx.fill();

  // Ponytail behind head
  const hc = '#7B3F00', hl = '#B5651D';
  ctx.fillStyle = hc;
  ctx.beginPath();
  ctx.moveTo(cx + headR - 2, headCY - 4);
  ctx.bezierCurveTo(cx + headR + 8, headCY, cx + headR + 10, headCY + 10, cx + headR + 6, headCY + 18);
  ctx.bezierCurveTo(cx + headR + 2, headCY + 22, cx + headR - 3, headCY + 16, cx + headR, headCY + 8);
  ctx.bezierCurveTo(cx + headR + 4, headCY + 4, cx + headR + 2, headCY - 2, cx + headR - 2, headCY - 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#E65100';
  ctx.beginPath(); ctx.arc(cx + headR + 2, headCY + 2, 3, 0, Math.PI*2); ctx.fill();

  // Ears
  ctx.fillStyle = skinDk;
  ctx.beginPath(); ctx.ellipse(cx - headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR, headCY, 4, 5, 0, 0, Math.PI*2); ctx.fill();

  // Face
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(cx, headCY, headR, 0, Math.PI*2); ctx.fill();

  // Hair cap
  ctx.fillStyle = hc;
  ctx.beginPath(); ctx.ellipse(cx, headCY - 2, headR, 9, 0, Math.PI, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx - headR + 2, headCY - 2, 4, 7, -0.4, Math.PI*1.1, Math.PI*1.9); ctx.fill();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.ellipse(cx - 2, headCY - 10, 6, 3, -0.2, Math.PI*1.1, Math.PI*1.9); ctx.fill();

  // Eyebrows
  ctx.strokeStyle = '#5C2E00'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx - 5, headCY - 3, 3.8, Math.PI + 0.45, Math.PI*2 - 0.45); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 5, headCY - 3, 3.8, Math.PI + 0.45, Math.PI*2 - 0.45); ctx.stroke();

  // Big sparkly eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx - 5, headCY + 2, 4.5, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 5, headCY + 2, 4.5, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#A0522D';
  ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 2.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(cx - 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 5, headCY + 2.5, 1.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx - 4, headCY + 1.5, 0.9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - 6.2, headCY + 3.2, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6, headCY + 1.5, 0.9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3.8, headCY + 3.2, 0.5, 0, Math.PI*2); ctx.fill();

  // Big rosy cheeks
  ctx.fillStyle = 'rgba(255,120,100,0.28)';
  ctx.beginPath(); ctx.ellipse(cx - 9, headCY + 6, 5.5, 3.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 9, headCY + 6, 5.5, 3.5, 0, 0, Math.PI*2); ctx.fill();

  // Big warm smile with teeth
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, headCY + 7, 4.5, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = '#b5673a'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx, headCY + 7, 4.5, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(cx, headCY + 7); ctx.lineTo(cx, headCY + 11.5); ctx.stroke();

  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (invincible && Math.floor(frameCount / 4) % 2 === 0) return;
  const baseY = p.ducking ? GROUND + 18 : p.y;
  const cx = p.x + p.w / 2;
  drawCartoonChar(cx, baseY, selectedChar === 'ted', p.ducking);
}

function drawBlueHorn(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // ── Bell — wide teardrop flare pointing right ──
  ctx.fillStyle = '#1565C0';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(10, -6, 26, -10, 32, 0);
  ctx.bezierCurveTo(38, 10, 28, 24, 14, 22);
  ctx.bezierCurveTo(4, 20, -4, 10, 0, 0);
  ctx.fill();
  // Bell face (lighter)
  ctx.fillStyle = '#2196F3';
  ctx.beginPath();
  ctx.moveTo(3, 2);
  ctx.bezierCurveTo(10, -3, 22, -6, 26, 2);
  ctx.bezierCurveTo(30, 9, 22, 19, 13, 17);
  ctx.bezierCurveTo(5, 15, 0, 9, 3, 2);
  ctx.fill();
  // Bell opening (dark hole)
  ctx.fillStyle = '#0D2B6E';
  ctx.beginPath(); ctx.ellipse(20, 10, 7, 9, 0.2, 0, Math.PI*2); ctx.fill();
  // Bell rim
  ctx.strokeStyle = '#90CAF9'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(20, 10, 7, 9, 0.2, 0, Math.PI*2); ctx.stroke();

  // ── Coil — two concentric arcs, thick and rounded ──
  ctx.lineCap = 'round';
  // Outer coil
  ctx.strokeStyle = '#1255A8'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(-6, 4, 14, Math.PI*0.15, Math.PI*1.92); ctx.stroke();
  ctx.strokeStyle = '#1E88E5'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-6, 4, 14, Math.PI*0.15, Math.PI*1.92); ctx.stroke();
  // Inner coil
  ctx.strokeStyle = '#1565C0'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(-6, 5, 7, Math.PI*0.4, Math.PI*1.75); ctx.stroke();
  ctx.strokeStyle = '#42A5F5'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(-6, 5, 7, Math.PI*0.4, Math.PI*1.75); ctx.stroke();

  // ── Mouthpiece — slim curved neck + round cup ──
  ctx.strokeStyle = '#1565C0'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-8, -8);
  ctx.quadraticCurveTo(-16, -14, -20, -20);
  ctx.stroke();
  ctx.strokeStyle = '#64B5F6'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-8, -8);
  ctx.quadraticCurveTo(-16, -14, -20, -20);
  ctx.stroke();
  // Cup
  ctx.fillStyle = '#1976D2';
  ctx.beginPath(); ctx.arc(-21, -21, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#BBDEFB';
  ctx.beginPath(); ctx.arc(-21, -21, 3, 0, Math.PI*2); ctx.fill();

  // ── Gloss highlights ──
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(-12, -2, 4, 2.5, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(10, 4, 5, 3, 0.3, 0, Math.PI*2); ctx.fill();

  // ── Sparkle ──
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 10px serif'; ctx.textAlign = 'center';
  ctx.fillText('✦', 14, -2);

  ctx.restore();
}

function drawYellowUmbrella(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // Canopy — semicircle with scalloped edge
  const canopyGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
  canopyGrad.addColorStop(0, '#FFF176');
  canopyGrad.addColorStop(1, '#F9A825');
  ctx.fillStyle = canopyGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 22, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  // Scallop bumps along bottom edge
  ctx.fillStyle = '#F9A825';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.arc(i * 10, 0, 6, 0, Math.PI); ctx.fill();
  }
  // Canopy ribs
  ctx.strokeStyle = 'rgba(255,200,0,0.5)'; ctx.lineWidth = 1;
  [-15, -8, 0, 8, 15].forEach(rx => {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(rx, 22); ctx.stroke();
  });
  // Gloss highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-6, -8, 8, 5, -0.3, 0, Math.PI*2); ctx.fill();
  // Handle — vertical stick + J-curve
  ctx.strokeStyle = '#795548'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 28); ctx.stroke();
  ctx.beginPath(); ctx.arc(5, 28, 5, Math.PI, Math.PI * 1.5); ctx.stroke();
  ctx.restore();
}

function drawObstacle(obs) {
  ctx.save();
  ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2); // draw centred

  if (obs.name === 'Goat') {
    // ── Cute cartoon goat ──
    const bx = 0, by = 6; // body centre offset

    // Body — rounded fluffy oval
    ctx.fillStyle = '#DCDCDC';
    ctx.beginPath(); ctx.ellipse(bx, by + 10, 20, 14, 0, 0, Math.PI*2); ctx.fill();
    // Fluffy texture highlight
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(bx - 5, by + 4, 10, 7, -0.3, 0, Math.PI*2); ctx.fill();

    // Head — big round
    ctx.fillStyle = '#E8E8E8';
    ctx.beginPath(); ctx.arc(bx + 14, by - 8, 13, 0, Math.PI*2); ctx.fill();

    // Horns — cute stubby curves
    ctx.fillStyle = '#B0A090';
    ctx.beginPath(); ctx.ellipse(bx + 9,  by - 19, 3, 6, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 19, by - 19, 3, 6,  0.3, 0, Math.PI*2); ctx.fill();

    // Ears — floppy
    ctx.fillStyle = '#F0C0B0';
    ctx.beginPath(); ctx.ellipse(bx + 3,  by - 10, 5, 8, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 25, by - 10, 5, 8,  0.6, 0, Math.PI*2); ctx.fill();

    // Eyes — big cute dots with shine
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(bx + 10, by - 9, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 19, by - 9, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx + 11, by - 10, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 20, by - 10, 1.2, 0, Math.PI*2); ctx.fill();

    // Snout
    ctx.fillStyle = '#F5B8A0';
    ctx.beginPath(); ctx.ellipse(bx + 14, by - 3, 6, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C08070';
    ctx.beginPath(); ctx.arc(bx + 11.5, by - 3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 16.5, by - 3, 1.5, 0, Math.PI*2); ctx.fill();

    // Little beard tuft
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(bx + 14, by + 3, 4, 5, 0, 0, Math.PI*2); ctx.fill();

    // Legs — 4 stubby rounded legs
    ctx.fillStyle = '#C8C8C8';
    [bx-14, bx-5, bx+5, bx+14].forEach(lx => {
      ctx.beginPath(); ctx.roundRect(lx - 3, by + 20, 7, 12, 3); ctx.fill();
    });
    // Hooves
    ctx.fillStyle = '#888';
    [bx-14, bx-5, bx+5, bx+14].forEach(lx => {
      ctx.beginPath(); ctx.ellipse(lx + 0.5, by + 32, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    });

  } else if (obs.name === 'Slutty Pumpkin') {
    // ── Redesigned pumpkin ──
    // Stem
    ctx.fillStyle = '#4E7A2A';
    ctx.beginPath(); ctx.roundRect(-4, -26, 7, 11, [3,3,0,0]); ctx.fill();
    // Curly tendril
    ctx.strokeStyle = '#4CAF50'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4,-22); ctx.quadraticCurveTo(12,-26,10,-20); ctx.stroke();
    // Pumpkin body — single smooth ellipse
    const pumpG = ctx.createRadialGradient(-5,-4,2,0,0,20);
    pumpG.addColorStop(0,'#FF8C42'); pumpG.addColorStop(1,'#C84B00');
    ctx.fillStyle = pumpG;
    ctx.beginPath(); ctx.ellipse(0, 0, 19, 17, 0, 0, Math.PI*2); ctx.fill();
    // Ribs — curved lines, not blobs
    ctx.strokeStyle = '#A03A00'; ctx.lineWidth = 1.8;
    [-10, 0, 10].forEach(rx => {
      ctx.beginPath(); ctx.moveTo(rx, -17); ctx.quadraticCurveTo(rx + (rx<0?-4:rx>0?4:0), 0, rx, 17); ctx.stroke();
    });
    // Shine
    ctx.fillStyle = 'rgba(255,200,150,0.3)';
    ctx.beginPath(); ctx.ellipse(-7,-7,7,5,-0.4,0,Math.PI*2); ctx.fill();
    // Eyes — large spiky triangles
    ctx.fillStyle = '#1A0800';
    ctx.beginPath(); ctx.moveTo(-12,-5); ctx.lineTo(-6,2); ctx.lineTo(-18,2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12,-5); ctx.lineTo(6,2); ctx.lineTo(18,2); ctx.closePath(); ctx.fill();
    // Toothy grin
    ctx.fillStyle = '#1A0800';
    ctx.beginPath(); ctx.roundRect(-12,5,24,8,2); ctx.fill();
    ctx.fillStyle = '#FF8C42';
    [-8,-2,4].forEach(tx => { ctx.beginPath(); ctx.roundRect(tx,6,4,6,1); ctx.fill(); });
    // Witch hat — tall pointy
    ctx.fillStyle = '#4A148C';
    ctx.beginPath(); ctx.roundRect(-14,-36,28,12,[4,4,0,0]); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9,-36); ctx.lineTo(0,-56); ctx.lineTo(9,-36); ctx.closePath(); ctx.fill();
    // Hat band + buckle
    ctx.fillStyle = '#FFD600';
    ctx.beginPath(); ctx.roundRect(-14,-28,28,6,2); ctx.fill();
    ctx.fillStyle = '#FF6F00';
    ctx.beginPath(); ctx.roundRect(-4,-30,8,10,1); ctx.fill();
    ctx.strokeStyle='#FFD600'; ctx.lineWidth=1.5;
    ctx.strokeRect(-4,-30,8,10);

  } else if (obs.name === 'Pizza') {
    // ── Cute pizza slice ──
    // Crust (rounded at top)
    ctx.fillStyle = '#D4956A';
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.quadraticCurveTo(-20, -12, -14, -18);
    ctx.quadraticCurveTo(0, -22, 14, -18);
    ctx.quadraticCurveTo(20, -12, 0, 18);
    ctx.closePath(); ctx.fill();
    // Crust highlight
    ctx.fillStyle = '#E8B080';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.quadraticCurveTo(-14, -8, -9, -15);
    ctx.quadraticCurveTo(0, -17, 9, -15);
    ctx.quadraticCurveTo(14, -8, 0, 12);
    ctx.closePath(); ctx.fill();
    // Cheese
    ctx.fillStyle = '#FDD835';
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.quadraticCurveTo(-11, -6, -6, -12);
    ctx.quadraticCurveTo(0, -13, 6, -12);
    ctx.quadraticCurveTo(11, -6, 0, 8);
    ctx.closePath(); ctx.fill();
    // Sauce blush
    ctx.fillStyle = '#E53935';
    ctx.beginPath(); ctx.ellipse(0, -2, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    // Pepperoni
    ctx.fillStyle = '#C62828';
    ctx.beginPath(); ctx.arc(-5, -8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 2, 3.5, 0, Math.PI*2); ctx.fill();
    // Pepperoni dots
    ctx.fillStyle = '#8B0000';
    [-5,5,0].forEach((px,i) => {
      const py = i<2 ? -8 : 2;
      ctx.beginPath(); ctx.arc(px-1, py-1, 1, 0, Math.PI*2); ctx.fill();
    });

  } else if (obs.name === 'Pineapple') {
    // ── Cute pineapple ──
    // Leaves on top — fan of rounded leaves
    const leafCol = ['#388E3C','#43A047','#2E7D32'];
    [[-10,-28,-0.5],[-2,-32,0],[10,-28,0.5]].forEach(([lx,ly,rot],i) => {
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(rot);
      ctx.fillStyle = leafCol[i];
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Body — golden rounded rectangle
    ctx.fillStyle = '#F9A825';
    ctx.beginPath(); ctx.roundRect(-13, -18, 26, 34, 10); ctx.fill();
    // Texture grid
    ctx.strokeStyle = '#E65100'; ctx.lineWidth = 1.2;
    for (let row = -12; row < 14; row += 7)
      for (let col = -9; col < 12; col += 7) {
        ctx.beginPath(); ctx.roundRect(col, row, 5, 5, 2); ctx.stroke();
      }
    // Face — big cute eyes
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-5, -2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -3, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -3, 1.2, 0, Math.PI*2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#5D3000'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 4, 5, 0.2, Math.PI-0.2); ctx.stroke();
    // Rosy cheeks
    ctx.fillStyle = 'rgba(220,80,50,0.2)';
    ctx.beginPath(); ctx.ellipse(-8, 5, 4, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, 5, 4, 3, 0, 0, Math.PI*2); ctx.fill();

  } else if (obs.name === 'Red Boots') {
    // ── Redesigned cowboy boot — proper side-view ──
    // Sole
    ctx.fillStyle = '#7B1210';
    ctx.beginPath(); ctx.ellipse(6, 16, 20, 5, 0, 0, Math.PI*2); ctx.fill();
    // Heel block
    ctx.fillStyle = '#8B1515';
    ctx.beginPath(); ctx.roundRect(-16, 8, 10, 9, [2,2,3,3]); ctx.fill();
    // Foot — long pointed toe extending right
    const bootGrad = ctx.createLinearGradient(-16, 0, 22, 0);
    bootGrad.addColorStop(0, '#C0392B'); bootGrad.addColorStop(1, '#E53935');
    ctx.fillStyle = bootGrad;
    ctx.beginPath();
    ctx.moveTo(-14, 4);
    ctx.lineTo(-14, 14);
    ctx.quadraticCurveTo(0, 18, 22, 10);
    ctx.quadraticCurveTo(26, 6, 20, 4);
    ctx.closePath(); ctx.fill();
    // Shaft — tall, curved top
    ctx.fillStyle = bootGrad;
    ctx.beginPath();
    ctx.moveTo(-14, 6);
    ctx.lineTo(-14, -22);
    ctx.quadraticCurveTo(-14, -28, -6, -28);
    ctx.quadraticCurveTo(6, -28, 8, -22);
    ctx.lineTo(8, 6);
    ctx.closePath(); ctx.fill();
    // Shaft highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.roundRect(-11, -24, 6, 20, 3); ctx.fill();
    // Pull strap tab at top
    ctx.fillStyle = '#922B21';
    ctx.beginPath(); ctx.roundRect(-4, -30, 6, 6, 2); ctx.fill();
    // Embroidered rose — simple 3-petal
    ctx.fillStyle = '#FF8A80';
    ctx.beginPath(); ctx.arc(-3, -12, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#EF5350';
    ctx.beginPath(); ctx.arc(-3, -12, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF8A80';
    ctx.beginPath(); ctx.ellipse(-7, -15, 3, 2, -0.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(1, -15, 3, 2, 0.8, 0, Math.PI*2); ctx.fill();
    // Leaf
    ctx.fillStyle = '#66BB6A';
    ctx.beginPath(); ctx.ellipse(2, -10, 3, 1.5, 0.6, 0, Math.PI*2); ctx.fill();
    // Stitching
    ctx.strokeStyle = '#FF8A80'; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(4, -22); ctx.lineTo(4, 4); ctx.stroke();
    ctx.setLineDash([]);

  } else if (obs.name === 'Ducky Tie') {
    // ── Redesigned Ducky Tie ──
    // Knot — diamond shape
    ctx.fillStyle = '#F9D71C';
    ctx.beginPath();
    ctx.moveTo(0,-22); ctx.lineTo(7,-17); ctx.lineTo(0,-12); ctx.lineTo(-7,-17);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(4,-18); ctx.lineTo(0,-14); ctx.lineTo(-4,-18); ctx.closePath(); ctx.fill();
    // Tie blade — clean trapezoid widening to point
    const tieG = ctx.createLinearGradient(-8,0,8,0);
    tieG.addColorStop(0,'#E6C200'); tieG.addColorStop(0.4,'#FFF176'); tieG.addColorStop(1,'#E6C200');
    ctx.fillStyle = tieG;
    ctx.beginPath();
    ctx.moveTo(-7,-12); ctx.lineTo(-10,8); ctx.lineTo(0,22); ctx.lineTo(10,8); ctx.lineTo(7,-12);
    ctx.closePath(); ctx.fill();
    // Duck pattern — side-profile, clean and simple
    // Body
    ctx.fillStyle = '#FFF176';
    ctx.beginPath(); ctx.ellipse(0, 2, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    // Head
    ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI*2); ctx.fill();
    // Eye
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(6.5, -4, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -4.5, 0.5, 0, Math.PI*2); ctx.fill();
    // Beak
    ctx.fillStyle = '#FF8F00';
    ctx.beginPath(); ctx.moveTo(9,-3); ctx.lineTo(14,-2); ctx.lineTo(9,-1); ctx.closePath(); ctx.fill();
    // Wing
    ctx.fillStyle = '#FFD600';
    ctx.beginPath(); ctx.ellipse(-1, 2, 5, 3, 0.3, 0, Math.PI*2); ctx.fill();
    // Bottom point of tie — darker
    ctx.fillStyle = '#C9A800';
    ctx.beginPath(); ctx.moveTo(-4,14); ctx.lineTo(0,22); ctx.lineTo(4,14); ctx.closePath(); ctx.fill();

  } else if (obs.name === "Marshall's Sandwich") {
    // ── Redesigned Marshall's Legendary Sandwich ──
    // Bottom bun — wide, golden, rounded bottom
    const bunG = ctx.createLinearGradient(0,6,0,18);
    bunG.addColorStop(0,'#E8A020'); bunG.addColorStop(1,'#A0660A');
    ctx.fillStyle = bunG;
    ctx.beginPath(); ctx.ellipse(0, 14, 22, 8, 0, 0, Math.PI*2); ctx.fill();
    // Lettuce — wavy green strip overhanging bun
    ctx.fillStyle = '#66BB6A';
    for (let lx = -20; lx <= 20; lx += 8) {
      ctx.beginPath(); ctx.ellipse(lx, 8, 5, 4, Math.sin(lx * 0.8) * 0.5, 0, Math.PI*2); ctx.fill();
    }
    // Tomato — bright red slab
    ctx.fillStyle = '#E53935';
    ctx.beginPath(); ctx.roundRect(-17, 0, 34, 8, 3); ctx.fill();
    ctx.fillStyle = '#FFCDD2';
    ctx.beginPath(); ctx.roundRect(-12, 1, 9, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(4, 1, 9, 5, 2); ctx.fill();
    // Cheese — melted, drooping over edges
    ctx.fillStyle = '#FDD835';
    ctx.beginPath(); ctx.roundRect(-18, -9, 36, 10, 3); ctx.fill();
    // Cheese drips
    ctx.beginPath(); ctx.moveTo(-14,-9); ctx.quadraticCurveTo(-16,-14,-13,-15); ctx.quadraticCurveTo(-10,-14,-12,-9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10,-9); ctx.quadraticCurveTo(12,-14,15,-15); ctx.quadraticCurveTo(18,-14,16,-9); ctx.fill();
    // Patty — thick dark brown oval
    const pattyG = ctx.createLinearGradient(0,-18,0,-9);
    pattyG.addColorStop(0,'#5D4037'); pattyG.addColorStop(1,'#4E342E');
    ctx.fillStyle = pattyG;
    ctx.beginPath(); ctx.roundRect(-18, -19, 36, 11, 4); ctx.fill();
    // Patty grill marks
    ctx.strokeStyle = '#3E2723'; ctx.lineWidth = 1.5;
    [-8,0,8].forEach(gx => {
      ctx.beginPath(); ctx.moveTo(gx-3,-18); ctx.lineTo(gx+3,-10); ctx.stroke();
    });
    // Top bun — big dome, shiny
    const topBunG = ctx.createRadialGradient(-6,-28,2,0,-22,20);
    topBunG.addColorStop(0,'#FFB74D'); topBunG.addColorStop(0.6,'#E8A020'); topBunG.addColorStop(1,'#A0660A');
    ctx.fillStyle = topBunG;
    ctx.beginPath(); ctx.ellipse(0, -24, 20, 15, 0, 0, Math.PI*2); ctx.fill();
    // Sesame seeds
    ctx.fillStyle = '#FFF9C4';
    [[-10,-26],[-3,-30],[6,-28],[11,-23],[-7,-21]].forEach(([sx,sy]) => {
      ctx.beginPath(); ctx.ellipse(sx,sy,2.5,1.3,sx*0.1,0,Math.PI*2); ctx.fill();
    });
    // "LEGENDARY" banner on bun
    ctx.fillStyle = '#FF6F00'; ctx.font = 'bold 5.5px monospace'; ctx.textAlign = 'center';
    ctx.fillText('LEGENDARY', 0, -22);
  }

  ctx.restore();
}

function drawBoss(boss) {
  ctx.save();
  ctx.translate(boss.x, boss.y);
  if (boss.type === 1) {
    // Giant cute cartoon goat — same style as obstacle but 2× scale
    ctx.scale(2, 2);
    const bx = 0, by = 10;

    // Body
    ctx.fillStyle = '#DCDCDC';
    ctx.beginPath(); ctx.ellipse(bx+28, by+22, 28, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(bx+18, by+14, 14, 10, -0.3, 0, Math.PI*2); ctx.fill();

    // Head
    ctx.fillStyle = '#E8E8E8';
    ctx.beginPath(); ctx.arc(bx+44, by+4, 18, 0, Math.PI*2); ctx.fill();

    // Horns
    ctx.fillStyle = '#B0A090';
    ctx.beginPath(); ctx.ellipse(bx+36, by-14, 4, 8, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+50, by-14, 4, 8,  0.3, 0, Math.PI*2); ctx.fill();

    // Ears
    ctx.fillStyle = '#F0C0B0';
    ctx.beginPath(); ctx.ellipse(bx+28, by+2, 6, 10, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+60, by+2, 6, 10,  0.6, 0, Math.PI*2); ctx.fill();

    // Eyes
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(bx+38, by+3, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+51, by+3, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx+39.5, by+1.5, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+52.5, by+1.5, 2, 0, Math.PI*2); ctx.fill();

    // Snout
    ctx.fillStyle = '#F5B8A0';
    ctx.beginPath(); ctx.ellipse(bx+44, by+12, 9, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C08070';
    ctx.beginPath(); ctx.arc(bx+40, by+12, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+48, by+12, 2.5, 0, Math.PI*2); ctx.fill();

    // Beard
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(bx+44, by+22, 6, 8, 0, 0, Math.PI*2); ctx.fill();

    // Legs
    ctx.fillStyle = '#C8C8C8';
    [bx+8, bx+18, bx+30, bx+40].forEach(lx => {
      ctx.beginPath(); ctx.roundRect(lx-4, by+38, 10, 16, 4); ctx.fill();
    });
    ctx.fillStyle = '#888';
    [bx+8, bx+18, bx+30, bx+40].forEach(lx => {
      ctx.beginPath(); ctx.ellipse(lx+1, by+54, 7, 4, 0, 0, Math.PI*2); ctx.fill();
    });
  } else if (boss.type === 2) {
    // Giant cute pumpkin boss
    ctx.scale(1.5, 1.5);
    const px = 35, py = 40;
    // Stem
    ctx.fillStyle = '#5D8A3C';
    ctx.beginPath(); ctx.roundRect(px-6, py-38, 12, 14, 5); ctx.fill();
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath(); ctx.ellipse(px+10, py-32, 10, 6, 0.6, 0, Math.PI*2); ctx.fill();
    // Three ribbed lobes
    [[-20,0,16,24],[0,0,20,28],[20,0,16,24]].forEach(([ex,ey,rx,ry]) => {
      ctx.fillStyle = '#E8650A';
      ctx.beginPath(); ctx.ellipse(px+ex, py+ey, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = '#F07020';
    ctx.beginPath(); ctx.ellipse(px, py-6, 7, 14, 0, 0, Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle = '#2C1200';
    ctx.beginPath(); ctx.moveTo(px-14,py-10); ctx.lineTo(px-8,py-4); ctx.lineTo(px-20,py-4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px+14,py-10); ctx.lineTo(px+20,py-4); ctx.lineTo(px+8,py-4); ctx.closePath(); ctx.fill();
    // Smile
    ctx.strokeStyle = '#2C1200'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py+8, 10, 0.2, Math.PI-0.2); ctx.stroke();
    // Witch hat
    ctx.fillStyle = '#7B1FA2';
    ctx.beginPath(); ctx.roundRect(px-22, py-54, 44, 14, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px-14, py-54); ctx.lineTo(px, py-76); ctx.lineTo(px+14, py-54); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.roundRect(px-24, py-44, 48, 7, 3); ctx.fill();
  } else if (boss.type === 3) {
    // Barney — dapper guy in a sharp suit
    // Legs
    ctx.fillStyle = '#0d47a1';
    ctx.fillRect(14, 82, 16, 26);
    ctx.fillRect(40, 82, 16, 26);
    // Shoes
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(22, 109, 12, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(48, 109, 12, 5, 0, 0, Math.PI*2); ctx.fill();
    // Suit jacket body
    ctx.fillStyle = '#0d47a1';
    ctx.beginPath();
    ctx.moveTo(10, 82); ctx.lineTo(10, 30); ctx.lineTo(35, 26); ctx.lineTo(60, 30); ctx.lineTo(60, 82);
    ctx.closePath(); ctx.fill();
    // White shirt front
    ctx.fillStyle = '#f5f5f5';
    ctx.beginPath();
    ctx.moveTo(28, 30); ctx.lineTo(35, 26); ctx.lineTo(42, 30); ctx.lineTo(42, 80); ctx.lineTo(28, 80);
    ctx.closePath(); ctx.fill();
    // Lapels
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.moveTo(28, 30); ctx.lineTo(10, 44); ctx.lineTo(10, 30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(42, 30); ctx.lineTo(60, 44); ctx.lineTo(60, 30); ctx.closePath(); ctx.fill();
    // Tie
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(33, 32); ctx.lineTo(37, 32); ctx.lineTo(39, 75); ctx.lineTo(35, 79); ctx.lineTo(31, 75);
    ctx.closePath(); ctx.fill();
    // Pocket square
    ctx.fillStyle = '#fff';
    ctx.fillRect(12, 38, 10, 8);
    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(13, 37, 8, 4);
    // Head (rounded)
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath(); ctx.ellipse(35, 16, 18, 17, 0, 0, Math.PI*2); ctx.fill();
    // Hair (short, blonde, slicked back)
    ctx.fillStyle = '#D4A017';
    ctx.beginPath(); ctx.ellipse(35, 4, 18, 11, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(17, 4, 36, 7);
    // Highlight streak
    ctx.fillStyle = '#F0C040';
    ctx.beginPath(); ctx.ellipse(32, 3, 7, 4, -0.2, 0, Math.PI); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(28, 17, 5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, 17, 5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.arc(29, 17, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(43, 17, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(30, 16, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(44, 16, 1.5, 0, Math.PI*2); ctx.fill();
    // Smirk
    ctx.strokeStyle = '#c9967a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(38, 24, 5, 0.1, Math.PI - 0.1); ctx.stroke();
    // Eyebrows (raised smugly)
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(24, 11); ctx.quadraticCurveTo(28, 9, 32, 11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(38, 11); ctx.quadraticCurveTo(42, 8, 46, 11); ctx.stroke();
  }
  ctx.restore();

  // Health bar
  const bw = 120;
  const bh = 12;
  const bx = boss.x + boss.w / 2 - bw / 2;
  const by = boss.y - 20;
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#e53935';
  ctx.fillRect(bx, by, bw * (boss.hp / boss.maxHp), bh);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP: ${boss.hp}/${boss.maxHp}`, bx + bw/2, by + 9);
}

function drawBossProjectile(proj) {
  ctx.save();
  ctx.translate(proj.x, proj.y);
  if (proj.type === 'pizza') {
    // Mini cute pizza slice
    ctx.fillStyle = '#D4956A';
    ctx.beginPath();
    ctx.moveTo(0, 9); ctx.quadraticCurveTo(-10,-5,-7,-10); ctx.quadraticCurveTo(0,-12,7,-10); ctx.quadraticCurveTo(10,-5,0,9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FDD835';
    ctx.beginPath();
    ctx.moveTo(0,5); ctx.quadraticCurveTo(-6,-3,-4,-7); ctx.quadraticCurveTo(0,-8,4,-7); ctx.quadraticCurveTo(6,-3,0,5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#E53935';
    ctx.beginPath(); ctx.ellipse(0,-1, 3, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C62828';
    ctx.beginPath(); ctx.arc(-3,-5, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-5, 2, 0, Math.PI*2); ctx.fill();
  } else if (proj.type === 'pineapple') {
    // Mini cute pineapple
    ctx.fillStyle = '#388E3C';
    ctx.beginPath(); ctx.ellipse(0,-9, 3, 6, -0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,-8, 3, 5, 0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F9A825';
    ctx.beginPath(); ctx.roundRect(-7,-6,14,16,6); ctx.fill();
    ctx.strokeStyle = '#E65100'; ctx.lineWidth = 0.8;
    for (let r=-4; r<9; r+=5) for (let c=-5; c<7; c+=5) { ctx.beginPath(); ctx.roundRect(c,r,4,4,2); ctx.stroke(); }
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-2,2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,2, 2, 0, Math.PI*2); ctx.fill();
  } else if (proj.type === 'boot') {
    // Mini cute boot
    ctx.fillStyle = '#C0392B';
    ctx.beginPath(); ctx.roundRect(-5,-11,11,13,[5,5,0,0]); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-6,2,14,7,[0,0,4,4]); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,6,5,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#922B21';
    ctx.beginPath(); ctx.roundRect(-7,7,16,4,2); ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.font='7px serif'; ctx.textAlign='center';
    ctx.fillText('★', 2, -2);
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, color,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 2) * 4,
      size: 4 + Math.random() * 6,
      alpha: 1
    });
  }
}

function spawnObstacle() {
  const pool = OBSTACLE_TYPES.filter(t => t.levels.includes(currentLevel));
  const typeDef = pool[Math.floor(Math.random() * pool.length)];
  // Vary height: most on ground, some higher
  const onGround = Math.random() > 0.25;
  const yOffset = onGround ? 0 : -(40 + Math.random() * 60);
  obstacles.push({
    x: 850,
    y: GROUND + 48 - typeDef.h + yOffset,
    w: typeDef.w,
    h: typeDef.h,
    name: typeDef.name,
    points: typeDef.points,
    typeDef,
    speed: gameSpeed + Math.random() * 1.5
  });
}

function spawnCollectible() {
  const yPos = GROUND - 20 - Math.random() * 100;
  const type = Math.random() < 0.5 ? 'horn' : 'umbrella';
  collectibles.push({
    x: 850, y: yPos,
    w: 32, h: 40,
    speed: gameSpeed,
    type
  });
}

function spawnBoss(level) {
  const types = { 1: { type: 1, hp: 5, maxHp: 5, w: 110, h: 130, projType: 'pizza' },
                   2: { type: 2, hp: 5, maxHp: 5, w: 70,  h: 100, projType: 'pineapple' },
                   3: { type: 3, hp: 6, maxHp: 6, w: 70,  h: 110, projType: 'boot' } };
  const def = types[level];
  boss = {
    ...def,
    x: 320, y: GROUND + 48 - def.h,
    baseY: GROUND + 48 - def.h,
    vx: -1.5, vy: 0,
    projTimer: 3000,
    bounceTimer: 0,
    hitFlash: 0,
    jumpTimer: 0
  };
}

function checkAABB(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

  bossPhase = false;

  if (currentLevel >= 3) {

  // Fade to title card (frame 260+)

    const alpha = Math.min((t - 260) / 70, 1);
    ctx.globalAlpha = alpha;

    ctx.globalAlpha = 1;

canvas.addEventListener('click', e => {
  if (state === STATES.GAME_OVER) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = 400 / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * (600 / rect.height);
    if (mx > 300 && mx < 500 && my > 305 && my < 355) startGame();

});

let bossIntroTimer = 0;
let showBossIntro = false;

function triggerBoss() {
  bossPhase = true;
  showBossIntro = true;
  bossIntroTimer = 2500;
  spawnBoss(currentLevel);
  state = STATES.BOSS;
}

function update(dt) {
  frameCount++;
  scrollX += gameSpeed;

  // Update parallax
  // (scroll handled in draw via modulo)

  // Player physics
  if (!player.onGround) {
    player.vy += 0.7;
    player.y += player.vy;
    if (player.y >= GROUND) {
      player.y = GROUND;
      player.vy = 0;
      player.onGround = true;
      jumpsUsed = 0;
    }
  }

  // Ducking
  if (duckPressed && player.onGround) {
    player.ducking = true;
  } else if (!duckPressed) {
    player.ducking = false;
  }

  // Invincibility
  if (invincible) {
    invincibleTimer -= dt;
    if (invincibleTimer <= 0) { invincible = false; flashRed = false; }
  }

  if (state === STATES.PLAYING) {
    // Spawn obstacles
    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      obstacleTimer = 1800 + Math.random() * 1200;
    }
    // Spawn collectibles
    collectibleTimer -= dt;
    if (collectibleTimer <= 0) {
      spawnCollectible();
      collectibleTimer = 1500 + Math.random() * 1500;
    }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= obs.speed;
      if (obs.x + obs.w < -10) { obstacles.splice(i, 1); continue; }
      // Collision
      const playerH = player.ducking ? 30 : player.h;
      const playerY = player.ducking ? player.y + (player.h - 30) : player.y;
      const pbox = { x: player.x + 4, y: playerY + 4, w: player.w - 8, h: playerH - 8 };
      const obox = { x: obs.x + 4, y: obs.y + 4, w: obs.w - 8, h: obs.h - 8 };
      if (!invincible && checkAABB(pbox, obox)) {
        score = Math.max(0, score + obs.points);
        invincible = true;
        invincibleTimer = 1500;
        flashRed = true;
        sfxHit();
        spawnParticles(obs.x + obs.w/2, obs.y, '#e53935', 8);
        lives--;
        obstacles.splice(i, 1);
        if (lives <= 0) {
          saveProgress(score, currentLevel);
          sfxGameOver();
          state = STATES.GAME_OVER;
          return;
        }
      }
    }

    // Move collectibles
    for (let i = collectibles.length - 1; i >= 0; i--) {
      const col = collectibles[i];
      col.x -= col.speed;
      if (col.x + col.w < -10) { collectibles.splice(i, 1); continue; }
      const pbox = { x: player.x + 2, y: player.y + 2, w: player.w - 4, h: player.h - 4 };
      const cbox = { x: col.x, y: col.y, w: col.w, h: col.h };
      if (checkAABB(pbox, cbox)) {
        score += 25;
        if (col.type === 'umbrella') {
          umbrellaCount++;
          spawnParticles(col.x + 16, col.y, '#FDD835', 10);
        } else {
          hornCount++;
          spawnParticles(col.x + 16, col.y, '#1e88e5', 10);
        }
        sfxCollect();
        collectibles.splice(i, 1);
        continue;
      }
    }

    // Score increases over time
    if (frameCount % 30 === 0) score++;

    // Check level transitions
    const lvl = LEVELS[currentLevel];
    if (lvl && score > lvl.scoreLimit && !bossPhase) {
      triggerBoss();
    }

    // Speed up over time
    if (frameCount % 900 === 0) gameSpeed = Math.min(gameSpeed + 0.2, 6);
  }

  if (state === STATES.BOSS) {
    if (showBossIntro) {
      bossIntroTimer -= dt;
      if (bossIntroTimer <= 0) showBossIntro = false;
    }

    if (boss && !showBossIntro) {
      // Boss stays right of centre — never walks onto the player
      const bossMinX = 180, bossMaxX = 330;
      if (boss.type === 1) {
        boss.x += boss.vx * 2;
        if (boss.x < bossMinX) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > bossMaxX) boss.vx = -Math.abs(boss.vx);
      } else if (boss.type === 2) {
        boss.x += boss.vx;
        if (boss.x < bossMinX) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > bossMaxX) boss.vx = -Math.abs(boss.vx);
        boss.vy += 0.5;
        boss.y += boss.vy;
        if (boss.y >= boss.baseY) {
          boss.y = boss.baseY;
          boss.vy = -frameCount % 120 < 60 ? -10 : 0;
        }
      } else if (boss.type === 3) {
        boss.x += boss.vx * 1.5;
        if (boss.x < bossMinX) boss.vx = Math.abs(boss.vx);
        if (boss.x + boss.w > bossMaxX) boss.vx = -Math.abs(boss.vx);
      }

      // Boss body → player collision (so they can't stack/overlap)
      const bossBodyBox = { x: boss.x, y: boss.y, w: boss.w, h: boss.h };
      const playerBox   = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
      if (!invincible && checkAABB(playerBox, bossBodyBox)) {
        score = Math.max(0, score - 15);
        invincible = true;
        invincibleTimer = 1500;
        flashRed = true;
        sfxHit();
        lives--;
        // Push player away from boss
        player.vy = -8;
        player.onGround = false;
        if (lives <= 0) {
          saveProgress(score, currentLevel);
          sfxGameOver();
          state = STATES.GAME_OVER;
          return;
        }
      }

      // Boss projectiles
      boss.projTimer -= dt;
      if (boss.projTimer <= 0) {
        bossProjectiles.push({
          x: boss.x, y: boss.y + boss.h/2,
          vx: -5, vy: -3 + Math.random() * 2,
          type: boss.projType
        });
        boss.projTimer = 1200 + Math.random() * 800;
      }

      // Move projectiles
      for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        const proj = bossProjectiles[i];
        proj.x += proj.vx;
        proj.vy += 0.2;
        proj.y += proj.vy;
        if (proj.x < -20 || proj.y > 650) { bossProjectiles.splice(i, 1); continue; }
        // Collision with player
        const pbox = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
        const prbox = { x: proj.x - 10, y: proj.y - 10, w: 20, h: 20 };
        if (!invincible && checkAABB(pbox, prbox)) {
          score = Math.max(0, score - 20);
          invincible = true;
          invincibleTimer = 1500;
          flashRed = true;
          sfxHit();
          lives--;
          bossProjectiles.splice(i, 1);
          if (lives <= 0) {
            saveProgress(score, currentLevel);
            sfxGameOver();
            state = STATES.GAME_OVER;
            return;
          }
        }
      }

      // Sword swing timer
      if (swordSwingTimer > 0) swordSwingTimer--;

      // Player sword slashes hit boss
      if (boss) {
        const bossHitBox = { x: boss.x, y: boss.y, w: boss.w, h: boss.h };
        for (let i = playerProjectiles.length - 1; i >= 0; i--) {
          if (!boss) break; // boss was killed mid-loop — stop immediately
          const pp = playerProjectiles[i];
          if (!pp.isSword) pp.vy += 0.25; // only gravity on non-sword projectiles
          pp.x += pp.vx;
          pp.y += pp.vy;
          if (pp.x > 450 || pp.y > 650) { playerProjectiles.splice(i, 1); continue; }
          if (checkAABB({ x: pp.x, y: pp.y, w: pp.w, h: pp.h }, bossHitBox)) {
            playerProjectiles.splice(i, 1);
            boss.hp--;
            sfxBossHit();
            spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#1e88e5', 10);
            boss.hitFlash = 15;
            if (boss.hp <= 0) {
              sfxBossDie();
              spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ffd700', 30);
              saveProgress(score, currentLevel);
              score += 100;
              playerProjectiles = [];
              transitionToNextLevel();
              break; // exit loop — boss is gone
            }
          }
        }
      }

      if (boss && boss.hitFlash > 0) boss.hitFlash--;
    }
  }

  // Level transition fade
  if (state === STATES.TRANSITION) {
    transitionTimer += 16;
    if (transitionTimer < 800) {
      transitionAlpha = Math.min(transitionTimer / 400, 1);
    } else {
      transitionAlpha = Math.max(1 - (transitionTimer - 800) / 400, 0);
      if (transitionAlpha <= 0) {
        state = STATES.PLAYING;
        transitionTimer = 0;
        transitionAlpha = 0;
      }
    }
    return;
  }

  // Ending cutscene update
  if (state === STATES.ENDING) {
    endingTimer++;
    if (endingTimer >= 300 && (keys['Space'] || keys['ArrowUp'])) {
      startGame();
    }
    return;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= 0.03;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  if (state === STATES.START) {
    drawStartScreen();
    return;
  }

  if (state === STATES.GAME_OVER) {
    drawBackground(currentLevel);
    drawParallax(currentLevel);
    drawGround(currentLevel);
    drawGameOver();
    return;
  }

  if (state === STATES.ENDING) {
    drawEnding();
    return;
  }

  // Game background
  drawBackground(currentLevel);

  // Level transition overlay
  if (state === STATES.TRANSITION && transitionAlpha > 0) {
    ctx.globalAlpha = transitionAlpha;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 400, 600);
    if (transitionAlpha > 0.7) {
      ctx.globalAlpha = (transitionAlpha - 0.7) / 0.3;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Georgia,serif';
      ctx.textAlign = 'center';
      ctx.fillText(`Level ${currentLevel}: ${LEVELS[currentLevel].name}`, 200, 285);
      ctx.font = '16px Georgia,serif';
      ctx.fillStyle = '#FDD835';
      ctx.fillText('Get ready!', 200, 330);
    }
    ctx.globalAlpha = 1;
  }
  drawParallax(currentLevel);
  drawGround(currentLevel);

  // Flash red on hit
  if (flashRed && invincible) {
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(0, 0, 400, 600);
  }

  // Draw collectibles
  collectibles.forEach(col => {
    if (col.type === 'umbrella') {
      drawYellowUmbrella(col.x + 16, col.y + 10);
    } else {
      drawBlueHorn(col.x + 16, col.y + 20);
    }
  });

  // Draw obstacles
  obstacles.forEach(obs => drawObstacle(obs));

  // Draw boss
  if (boss) {
    if (boss.hitFlash > 0 && Math.floor(boss.hitFlash / 3) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }
    drawBoss(boss);
    ctx.globalAlpha = 1;
  }

  // Boss projectiles
  bossProjectiles.forEach(proj => drawBossProjectile(proj));

  // Player sword slashes
  playerProjectiles.forEach(pp => {
    ctx.save();
    ctx.translate(pp.x + pp.w / 2, pp.y + pp.h / 2);
    // Sword blade
    const bladeGrad = ctx.createLinearGradient(-20, -4, 20, 4);
    bladeGrad.addColorStop(0, '#C0C0C0');
    bladeGrad.addColorStop(0.5, '#FFFFFF');
    bladeGrad.addColorStop(1, '#9E9E9E');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath(); ctx.roundRect(-20, -3, 38, 6, 2); ctx.fill();
    // Tip
    ctx.fillStyle = '#E0E0E0';
    ctx.beginPath(); ctx.moveTo(18, -3); ctx.lineTo(26, 0); ctx.lineTo(18, 3); ctx.closePath(); ctx.fill();
    // Guard
    ctx.fillStyle = '#8D6E63';
    ctx.beginPath(); ctx.roundRect(-22, -6, 6, 12, 2); ctx.fill();
    // Slash trail
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-18, -8); ctx.quadraticCurveTo(-5, 0, -18, 8); ctx.stroke();
    ctx.restore();
  });
  // Sword swing animation on Ted
  if (swordSwingTimer > 0) {
    const angle = ((18 - swordSwingTimer) / 18) * Math.PI * 0.8 - 0.4;
    ctx.save();
    ctx.translate(player.x + player.w + 6, player.y + 14);
    ctx.rotate(angle);
    const sg = ctx.createLinearGradient(0, -2, 28, 2);
    sg.addColorStop(0, '#BDBDBD'); sg.addColorStop(0.5, '#FFFFFF'); sg.addColorStop(1, '#9E9E9E');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.roundRect(0, -3, 28, 6, 2); ctx.fill();
    ctx.fillStyle = '#E0E0E0';
    ctx.beginPath(); ctx.moveTo(26,-3); ctx.lineTo(33,0); ctx.lineTo(26,3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8D6E63';
    ctx.beginPath(); ctx.roundRect(-2, -7, 5, 14, 2); ctx.fill();
    ctx.restore();
  }

  // Draw player
  drawPlayer();

  // Boss fight throw hint
  if (state === STATES.BOSS && !showBossIntro) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(10, 38, 260, 26, 6); ctx.fill();
    ctx.fillStyle = '#fdd835';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('[ F ] or [ → ] Sword Attack!', 18, 56);
    ctx.fillStyle = '#aaa';
    ctx.font = '11px monospace';
    ctx.fillText('Mobile: tap right side of screen', 18, 72);
  }

  // Particles
  drawParticles();

  // HUD
  drawHUD();

  // Boss intro overlay
  if (showBossIntro) {
    drawBossIntro();
  }
}

let lastTime = 0;
function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// Init
initParallax(1);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
