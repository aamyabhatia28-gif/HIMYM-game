"use strict";

//=================================================================
// SETUP
//=================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 390, H = 700;

function fitCanvas() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const ratio = W / H;
  let cw = ww, ch = ww / ratio;
  if (ch > wh) { ch = wh; cw = wh * ratio; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

//=================================================================
// STATE MACHINE
//=================================================================
const STATE = {
  TITLE: 'TITLE',
  PLAYING: 'PLAYING',
  DIALOGUE: 'DIALOGUE',
  CLUES_OPEN: 'CLUES_OPEN',
  CHAPTER_COMPLETE: 'CHAPTER_COMPLETE',
  REVEAL: 'REVEAL',
  ENDING: 'ENDING',
  ENDING_FINAL: 'ENDING_FINAL'
};

let game = {
  state: STATE.TITLE,
  prevState: STATE.TITLE,
  chapter: 0,
  cluesFound: [],
  chapterClues: [0,0,0,0],
  endingChosen: null,
  time: 0,
  transition: 0,
  transitioning: false,
  transitionTarget: null,
  _transHalf: false,
  shake: 0,
  particles: [],
  tracyRevealed: false
};

//=================================================================
// SAVE SYSTEM
//=================================================================
const SAVE_KEY = 'himym_save';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      chapter: game.chapter,
      cluesFound: game.cluesFound,
      chapterClues: game.chapterClues,
      endingChosen: game.endingChosen
    }));
  } catch(e) {}
}
function loadSave() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    return JSON.parse(s);
  } catch(e) { return null; }
}
function hasSave() {
  const s = loadSave();
  return s && (s.chapter > 0 || (s.cluesFound && s.cluesFound.length > 0));
}

//=================================================================
// AUDIO - La Vie en Rose melody via Web Audio
//=================================================================
let audioCtx = null;
let melodyPlaying = false;
let melodyTimer = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playNote(freq, startTime, dur, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.05);
}

const NOTE = {
  'E4': 329.63, 'F4': 349.23, 'Fs4': 369.99, 'G4': 392.00,
  'A4': 440.00, 'B4': 493.88, 'C5': 523.25, 'D5': 587.33,
  'E5': 659.25, 'Cs5': 554.37, 'Gs4': 415.30, 'D4': 293.66,
  'Cs4': 277.18, 'B3': 246.94, 'A3': 220.00, 'Fs3': 185.00
};

const MELODY = [
  ['E4',1],['A4',1],['B4',1],['C5',1],['A4',1.5],['Fs4',0.5],['E4',2],
  ['E4',1],['A4',1],['B4',1],['C5',1],['B4',1.5],['A4',0.5],['Gs4',2],
  ['Cs5',1],['B4',1],['A4',1],['Gs4',1],['Fs4',1.5],['E4',0.5],['Fs4',2],
  ['A4',1],['Gs4',1],['Fs4',1],['E4',1],['Cs4',1.5],['B3',0.5],['A3',2]
];

function startMelody() {
  if (melodyPlaying || !audioCtx) return;
  melodyPlaying = true;
  scheduleMelody();
}
function scheduleMelody() {
  if (!audioCtx) return;
  const beat = 0.42;
  let t = audioCtx.currentTime + 0.1;
  let total = 0;
  for (const [n, b] of MELODY) {
    const f = NOTE[n] || 440;
    playNote(f, t, b * beat * 0.95, 0.12);
    t += b * beat;
    total += b * beat;
  }
  melodyTimer = setTimeout(() => { if (melodyPlaying) scheduleMelody(); }, total * 1000);
}
function stopMelody() {
  melodyPlaying = false;
  if (melodyTimer) clearTimeout(melodyTimer);
}

function blip() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  playNote(660, t, 0.08, 0.06);
}

//=================================================================
// INPUT
//=================================================================
let pointer = { x: 0, y: 0, down: false, justPressed: false };

function getCanvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = (clientX - r.left) / r.width * W;
  const y = (clientY - r.top) / r.height * H;
  return { x, y };
}

function handleDown(clientX, clientY) {
  initAudio();
  const p = getCanvasPos(clientX, clientY);
  pointer.x = p.x; pointer.y = p.y;
  pointer.down = true;
  pointer.justPressed = true;
}

canvas.addEventListener('mousedown', e => { handleDown(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', () => { pointer.down = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  handleDown(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); pointer.down = false; }, { passive: false });

//=================================================================
// HELPERS
//=================================================================
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function pointIn(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}
function lerp(a, b, t) { return a + (b - a) * t; }

function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

//=================================================================
// DIALOGUE SYSTEM
//=================================================================
let dialogueQueue = [];
let dialogueIndex = 0;
let activeHotspot = null;

function startDialogue(hotspot) {
  if (hotspot.reveal) { triggerReveal(); return; }
  if (hotspot.special === 'shake') game.shake = 18;
  dialogueQueue = hotspot.dialogue.slice();
  dialogueIndex = 0;
  activeHotspot = hotspot;
  game.prevState = STATE.PLAYING;
  game.state = STATE.DIALOGUE;
  blip();
}

function advanceDialogue() {
  dialogueIndex++;
  if (dialogueIndex >= dialogueQueue.length) {
    if (activeHotspot && !activeHotspot.found) {
      activeHotspot.found = true;
      if (activeHotspot.clue) {
        game.cluesFound.push(activeHotspot.clue);
        game.chapterClues[game.chapter]++;
        spawnParticles(activeHotspot.x + activeHotspot.w/2, activeHotspot.y + activeHotspot.h/2);
      }
      saveGame();
      checkChapterComplete();
    }
    if (game.state === STATE.DIALOGUE) game.state = STATE.PLAYING;
    activeHotspot = null;
  } else {
    blip();
  }
}

function checkChapterComplete() {
  const ch = chapters[game.chapter];
  const total = ch.hotspots.filter(h => h.clue).length;
  const found = ch.hotspots.filter(h => h.clue && h.found).length;
  if (found >= total) {
    setTimeout(() => {
      game.state = STATE.CHAPTER_COMPLETE;
      chapterCompleteTimer = 0;
    }, 600);
  }
}

//=================================================================
// PARTICLES
//=================================================================
function spawnParticles(x, y) {
  for (let i=0;i<22;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*3;
    game.particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1,
      life: 1, size: 2+Math.random()*3,
      color: ['#ffe35a','#fff','#ffd070','#ffb0d0'][Math.floor(Math.random()*4)]
    });
  }
}
function updateParticles(dt) {
  for (let i=game.particles.length-1;i>=0;i--){
    const p = game.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    p.life -= dt*0.7;
    if (p.life <= 0) game.particles.splice(i,1);
  }
}
function drawParticles() {
  for (const p of game.particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    for (let k=0;k<5;k++){
      const a = k*2*Math.PI/5 - Math.PI/2;
      const r = p.size*(k%2===0?1:0.5)*1.2;
      const px = p.x+Math.cos(a)*r, py = p.y+Math.sin(a)*r;
      k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

//=================================================================
// TRANSITIONS
//=================================================================
function startTransition(cb) {
  game.transitioning = true;
  game.transition = 0;
  game._transHalf = false;
  game.transitionTarget = cb;
}
function updateTransition(dt) {
  if (!game.transitioning) return;
  if (!game._transHalf) {
    game.transition += dt*1.8;
    if (game.transition >= 1) {
      game.transition = 1;
      game._transHalf = true;
      if (game.transitionTarget) game.transitionTarget();
    }
  } else {
    game.transition -= dt*1.8;
    if (game.transition <= 0) {
      game.transition = 0;
      game.transitioning = false;
      game._transHalf = false;
      game.transitionTarget = null;
    }
  }
}

//=================================================================
// HOTSPOT RENDERING
//=================================================================
function drawHotspots() {
  const ch = chapters[game.chapter];
  const pulse = 0.5 + 0.5*Math.sin(game.time*3);
  for (const h of ch.hotspots) {
    if (h.found && h.clue) continue;
    ctx.save();
    ctx.strokeStyle = `rgba(255,225,120,${0.45 + pulse*0.45})`;
    ctx.lineWidth = 2 + pulse*1.5;
    ctx.shadowColor = 'rgba(255,225,120,0.9)';
    ctx.shadowBlur = 8 + pulse*12;
    rrect(h.x, h.y, h.w, h.h, 10);
    ctx.stroke();
    ctx.restore();
    if (h.label && h.label !== '') {
      ctx.font = '10px Georgia'; ctx.textAlign='center';
      const tw = ctx.measureText(h.label).width + 12;
      ctx.fillStyle = 'rgba(20,20,30,0.75)';
      rrect(h.x + h.w/2 - tw/2, h.y - 18, tw, 15, 7); ctx.fill();
      ctx.fillStyle = '#ffe178';
      ctx.fillText(h.label, h.x + h.w/2, h.y - 7);
    }
  }
}

  ctx.fillStyle='#ffe178'; ctx.font='bold 26px Georgia';
  ctx.fillText('Choose the Ending', W/2, 80);
  ctx.fillStyle='#cfc8e0'; ctx.font='italic 13px Georgia';
  ctx.fillText('Every great story deserves the right last page.', W/2, 106);
  endingBtns = [];
  let by = 150;
  for (const e of endings){
    const h = 120;
    ctx.fillStyle = e.color;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=8;
    rrect(25, by, W-50, h, 16); ctx.fill(); ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='bold 19px Georgia';
    ctx.fillText(e.title, W/2, by+30);
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='12px Georgia';
    const lines = wrapText(e.desc, W-90);
    let ty = by+52;
    for (const ln of lines){ ctx.fillText(ln, W/2, ty); ty+=17; }
    endingBtns.push({ x:25, y:by, w:W-50, h, ending:e });
    by += h+16;
  }
}

//=================================================================
// FINAL ENDING SCENE
//=================================================================
let finalBtn = null;
function drawFinalEnding() {
  const e = endings.find(x=>x.id===game.endingChosen) || endings[0];
  const bg = ctx.createLinearGradient(0,0,0,H);
  if (e.id==='frenchhorn'){ bg.addColorStop(0,'#1a2a4a'); bg.addColorStop(1,'#0a1428'); }
  else if (e.id==='beginning'){ bg.addColorStop(0,'#3a4a6a'); bg.addColorStop(1,'#1a2438'); }
  else { bg.addColorStop(0,'#b87a4a'); bg.addColorStop(1,'#5a3a2a'); }
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.fillStyle='#ffe178'; ctx.font='bold 24px Georgia';
  ctx.fillText(e.title, W/2, 70);

  const bob = Math.sin(game.time*1.5)*3;

  if (e.id==='beautiful'){
    const sway = Math.sin(game.time*1.2)*8;
    drawTed(W/2-30+sway, 430, 1.1);
    drawTracy(W/2+30+sway, 430, 1.1, true);
    for (let i=0;i<6;i++){
      const hx=W/2+(i-2.5)*40; const hy=250 - (game.time*30 + i*40)%200;
      drawHeart(hx, hy, 8+ (i%2)*4, '#ff7fa0');
    }
    ctx.fillStyle='#fff'; ctx.font='italic 15px Georgia';
    drawWrapped('A home, two kids, and a love that filled every rainy day with light.', W/2, 540, W-60, 22);
  } else if (e.id==='frenchhorn'){
    drawTed(W/2, 470+bob, 1.2);
    drawFrenchHorn(W/2+35, 400+bob);
    ctx.fillStyle='#2a2a3a'; rrect(W/2-50,150,100,110,6); ctx.fill();
    ctx.fillStyle='#ffe9a8'; rrect(W/2-44,156,88,98,4); ctx.fill();
    drawRobin(W/2, 250, 0.5);
    ctx.fillStyle='#fff'; ctx.font='italic 15px Georgia';
    drawWrapped('Some stories circle back. Beneath her window, the blue french horn plays once more.', W/2, 560, W-60, 22);
  } else {
    drawTed(W/2-26, 470+bob, 1.0);
    drawTracy(W/2+26, 470+bob, 1.0, true);
    ctx.save(); ctx.shadowColor='rgba(255,225,90,0.6)'; ctx.shadowBlur=18;
    drawYellowUmbrella(W/2, 320+bob, 2.2); ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='italic 15px Georgia';
    drawWrapped('Two strangers, one umbrella, and a whole story still waiting to be written.', W/2, 560, W-60, 22);
  }

  ctx.fillStyle='#ffe178'; ctx.font='bold 22px Georgia';
  ctx.fillText('The End', W/2, H-90);
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='14px Georgia';
  ctx.fillText('Clues collected: ' + game.cluesFound.length, W/2, H-62);
  ctx.fillStyle='#7a4a22';
  rrect(W/2-90, H-50, 180, 40, 12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px Georgia';
  ctx.fillText('Play Again', W/2, H-23);
  finalBtn = { x:W/2-90, y:H-50, w:180, h:40 };
}

function drawHeart(x, y, s, color){
  ctx.save(); ctx.translate(x,y); ctx.scale(s/10,s/10);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,3);
  ctx.bezierCurveTo(-6,-5,-12,2,0,12);
  ctx.bezierCurveTo(12,2,6,-5,0,3);
  ctx.fill();
  ctx.restore();
}
function drawFrenchHorn(x, y){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='#4a7ad0'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*1.7); ctx.stroke();
  ctx.beginPath(); ctx.arc(2,2,9,0,Math.PI*1.5); ctx.stroke();
  ctx.fillStyle='#4a7ad0';
  ctx.beginPath(); ctx.moveTo(14,-6); ctx.lineTo(30,-16); ctx.lineTo(30,6); ctx.lineTo(14,2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawWrapped(text, cx, y, maxW, lh){
  const lines = wrapText(text, maxW);
  let ty=y;
  for (const ln of lines){ ctx.fillText(ln, cx, ty); ty+=lh; }
}

//=================================================================
// DIALOGUE OVERLAY
//=================================================================
function drawDialogue() {
  const line = dialogueQueue[dialogueIndex] || '';
  let speaker = 'Ted';
  const m = line.match(/^([A-Za-z &]+)\s*\(/) || line.match(/^([A-Za-z &]+):/);
  if (m) speaker = m[1].trim();
  if (line.startsWith('Ted thinks')) speaker = 'Ted';
  if (line.startsWith('Future Ted')) speaker = 'Ted';
  if (line.startsWith('A book') || line.startsWith('A soft')) speaker = 'narrator';

  ctx.fillStyle = 'rgba(245,238,220,0.97)';
  rrect(12, 520, W-24, 168, 16); ctx.fill();
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth=3;
  rrect(12, 520, W-24, 168, 16); ctx.stroke();

  ctx.save();
  rrect(24, 532, 66, 66, 10); ctx.clip();
  ctx.fillStyle='#cfe0f0'; ctx.fillRect(24,532,66,66);
  ctx.translate(57, 626);
  ctx.scale(0.5,0.5);
  if (speaker==='Barney') drawBarney(0,0,1.0);
  else if (speaker==='Robin') drawRobin(0,0,1.0);
  else if (speaker==='Marshall') drawMarshallTux(0,0);
  else if (speaker==='Lily' || speaker==='Marshall & Lily') drawMarshallLily(0,0,1.0);
  else if (speaker==='Tracy') drawTracy(0,0,1.0, game.tracyRevealed);
  else if (speaker==='Musician') drawMusician(0,0);
  else if (speaker==='narrator'){ ctx.fillStyle='#888'; ctx.font='40px Georgia'; ctx.textAlign='center'; ctx.fillText('☂',0,-20); }
  else drawTed(0,0,1.0);
  ctx.restore();
  ctx.strokeStyle='#7a4a22'; ctx.lineWidth=2;
  rrect(24,532,66,66,10); ctx.stroke();

  let displayName = speaker;
  if (speaker==='narrator') displayName='';
  if (line.startsWith('Future Ted')) displayName='Future Ted';
  if (displayName){
    ctx.fillStyle='#7a4a22'; ctx.font='bold 15px Georgia'; ctx.textAlign='left';
    ctx.fillText(displayName, 102, 548);
  }

  let txt = line.replace(/^[A-Za-z &]+\s*\([^)]*\):\s*/, '').replace(/^[A-Za-z &]+:\s*/, '');
  ctx.fillStyle='#2a1a0a'; ctx.font='15px Georgia'; ctx.textAlign='left';
  const lines = wrapText(txt, W-130);
  let ty = displayName ? 568 : 552;
  for (const ln of lines){
    ctx.fillText(ln, 102, ty);
    ty += 20;
    if (ty > 660) break;
  }

  const blink = 0.5+0.5*Math.sin(game.time*4);
  ctx.fillStyle=`rgba(122,74,34,${0.5+blink*0.5})`;
  ctx.font='12px Georgia'; ctx.textAlign='right';
  ctx.fillText(dialogueIndex < dialogueQueue.length-1 ? 'tap ▸' : 'tap to finish ▸', W-28, 678);
}

//=================================================================
// CLICK HANDLING
//=================================================================
function handleClick() {
  const px = pointer.x, py = pointer.y;
  switch(game.state) {
    case STATE.TITLE: {
      for (const b of titleBtns){
        if (pointIn(px,py,b.x,b.y,b.w,b.h)){
          blip();
          if (b.label==='Continue'){
            const s = loadSave();
            if (s){
              game.chapter = s.chapter||0;
              game.cluesFound = s.cluesFound||[];
              game.chapterClues = s.chapterClues||[0,0,0,0];
              game.endingChosen = s.endingChosen||null;
              restoreFoundHotspots();
            }
            enterChapter(game.chapter);
          } else {
            newGame();
          }
          return;
        }
      }
      break;
    }
    case STATE.PLAYING: {
      if (pointIn(px,py,NB_BTN.x,NB_BTN.y,NB_BTN.w,NB_BTN.h)){
        blip(); game.prevState=STATE.PLAYING; game.state=STATE.CLUES_OPEN; return;
      }
      const ch = chapters[game.chapter];
      for (const h of ch.hotspots){
        if (h.found && h.clue) continue;
        if (pointIn(px,py,h.x,h.y,h.w,h.h)){ startDialogue(h); return; }
      }
      break;
    }
    case STATE.DIALOGUE: advanceDialogue(); break;
    case STATE.CLUES_OPEN: {
      if (pointIn(px,py,W/2-70,H-78,140,44)){
        blip(); game.state = game.prevState || STATE.PLAYING; return;
      }
      game.state = game.prevState || STATE.PLAYING;
      break;
    }
    case STATE.CHAPTER_COMPLETE: {
      if (ccBtn && pointIn(px,py,ccBtn.x,ccBtn.y,ccBtn.w,ccBtn.h)){
        blip();
        if (game.chapter >= chapters.length-1){
          triggerReveal();
        } else {
          startTransition(()=>{ enterChapter(game.chapter+1); });
        }
      }
      break;
    }
    case STATE.REVEAL: {
      if (revealTimer > 4.5){
        blip();
        startTransition(()=>{ game.state = STATE.ENDING; });
      }
      break;
    }
    case STATE.ENDING: {
      for (const b of endingBtns){
        if (pointIn(px,py,b.x,b.y,b.w,b.h)){
          blip();
          game.endingChosen = b.ending.id;
          saveGame();
          startTransition(()=>{ game.state = STATE.ENDING_FINAL; });
          return;
        }
      }
      break;
    }
    case STATE.ENDING_FINAL: {
      if (finalBtn && pointIn(px,py,finalBtn.x,finalBtn.y,finalBtn.w,finalBtn.h)){
        blip();
        stopMelody();
        try { localStorage.removeItem(SAVE_KEY); } catch(e){}
        newGameReset();
        game.state = STATE.TITLE;
      }
      break;
    }
  }
}

function restoreFoundHotspots() {
  for (let c=0;c<chapters.length;c++){
    for (const h of chapters[c].hotspots){
      if (h.clue && game.cluesFound.includes(h.clue)) h.found = true;
    }
  }
}

function newGameReset() {
  game.chapter = 0;
  game.cluesFound = [];
  game.chapterClues = [0,0,0,0];
  game.endingChosen = null;
  game.tracyRevealed = false;
  game.particles = [];
  for (const ch of chapters) for (const h of ch.hotspots) h.found = false;
}

function newGame() {
  newGameReset();
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  enterChapter(0);
}

function enterChapter(n) {
  game.chapter = n;
  game.state = STATE.PLAYING;
  if (chapters[n].melody) { initAudio(); startMelody(); }
  saveGame();
}

//=================================================================
// MAIN LOOP
//=================================================================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  game.time += dt;

  if (pointer.justPressed) {
    handleClick();
    pointer.justPressed = false;
  }

  updateParticles(dt);
  updateTransition(dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt*40);
  if (game.state === STATE.REVEAL) revealTimer += dt;
  if (game.state === STATE.CHAPTER_COMPLETE) chapterCompleteTimer += dt;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (game.shake > 0){
    ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  }

  switch(game.state){
    case STATE.TITLE: drawTitle(); break;
    case STATE.PLAYING:
    case STATE.DIALOGUE:
    case STATE.CLUES_OPEN: {
      const ch = chapters[game.chapter];
      ch.drawScene();
      drawSceneCharacters();
      if (game.state === STATE.PLAYING) drawHotspots();
      drawParticles();
      drawHUD();
      if (game.state === STATE.PLAYING) drawNotebookButton();
      if (game.state === STATE.DIALOGUE) drawDialogue();
      if (game.state === STATE.CLUES_OPEN) drawNotebookOverlay();
      break;
    }
    case STATE.CHAPTER_COMPLETE: drawChapterComplete(); break;
    case STATE.REVEAL: drawReveal(); break;
    case STATE.ENDING: drawEndingChoice(); break;
    case STATE.ENDING_FINAL: drawFinalEnding(); break;
  }

  ctx.restore();

  if (game.transitioning){
    ctx.fillStyle = `rgba(0,0,0,${game.transition})`;
    ctx.fillRect(0,0,W,H);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
